name: PDM Browser Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [pdm-ux-response-review]
permissions:
  contents: read
jobs:
  pdm-browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run PDM browser smoke tests
        run: |
          mkdir -p test-results
          node tests/pdm-browser-smoke.cjs
      - name: Upload rendered PDM screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdm-browser-preview
          path: test-results/
          if-no-files-found: warn
