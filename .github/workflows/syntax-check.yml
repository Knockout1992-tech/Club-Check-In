
name: JavaScript Syntax Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check index.html JavaScript
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          scripts = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              html,
              re.DOTALL | re.IGNORECASE
          )

          for i, script in enumerate(scripts, 1):
              result = subprocess.run(
                  ["node", "--check"],
                  input=script,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  print(f"JavaScript syntax error in script block {i}:")
                  print(result.stderr)
                  sys.exit(1)

          print(f"JavaScript syntax check passed ({len(scripts)} script blocks checked).")
          PY

      - name: Automatically increment PWA version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import re

          path = "service-worker.js"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r'(const CACHE_NAME = "club-check-in-v)(\d+)(";)'

          def increment(match):
              version = int(match.group(2)) + 1
              return f"{match.group(1)}{version:03d}{match.group(3)}"

          updated, count = re.subn(
              pattern, increment, content, count=1
          )

          if count != 1:
              raise SystemExit("Could not find CACHE_NAME version.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(updated)

          print("Updated cache version automatically.")
          PY

      - name: Commit version update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js

          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-version PWA [skip ci]"
            git push
          fi