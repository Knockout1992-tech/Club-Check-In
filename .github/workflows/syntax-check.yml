
name: PWA Versioning and Syntax Check

concurrency:
  group: club-check-in-main-versioning
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check index.html JavaScript
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          scripts = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              html,
              re.DOTALL | re.IGNORECASE
          )

          for i, script in enumerate(scripts, 1):
              result = subprocess.run(
                  ["node", "--check"],
                  input=script,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  print(f"JavaScript syntax error in script block {i}:")
                  print(result.stderr)
                  sys.exit(1)

          print(f"JavaScript syntax check passed ({len(scripts)} script blocks checked).")
          PY

      - name: Automatically increment versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          python3 - <<'PY'
          import re
          import sys

          config_path = "js/config.js"
          worker_path = "service-worker.js"

          # Read config.js
          with open(config_path, "r", encoding="utf-8") as f:
              config = f.read()

          version_pattern = r'(const\s+APP_VERSION\s*=\s*["\']V)(\d+)\.(\d+)\.(\d+)(["\'];)'

          def increment_version(match):
              major = int(match.group(2))
              minor = int(match.group(3))
              patch = int(match.group(4))

              if patch >= 9:
                  patch = 0
                  minor += 1

                  if minor >= 10:
                      minor = 0
                      major += 1
              else:
                  patch += 1

              return (
                  f"{match.group(1)}"
                  f"{major}.{minor}.{patch}"
                  f"{match.group(5)}"
              )

          config_updated, config_count = re.subn(
              version_pattern,
              increment_version,
              config,
              count=1
          )

          if config_count != 1:
              sys.exit("ERROR: Could not find APP_VERSION in js/config.js")

          # Read service worker
          with open(worker_path, "r", encoding="utf-8") as f:
              worker = f.read()

          cache_pattern = r'(const\s+CACHE_NAME\s*=\s*["\']club-check-in-v)(\d+)(["\'];)'

          def increment_cache(match):
              return (
                  f"{match.group(1)}"
                  f"{int(match.group(2)) + 1:03d}"
                  f"{match.group(3)}"
              )

          worker_updated, worker_count = re.subn(
              cache_pattern,
              increment_cache,
              worker,
              count=1
          )

          if worker_count != 1:
              sys.exit("ERROR: Could not find CACHE_NAME in service-worker.js")

          # Write both files
          with open(config_path, "w", encoding="utf-8") as f:
              f.write(config_updated)

          with open(worker_path, "w", encoding="utf-8") as f:
              f.write(worker_updated)

          print("Updated APP_VERSION:", re.search(version_pattern, config_updated).group(0))
          print("Updated CACHE_NAME:", re.search(cache_pattern, worker_updated).group(0))
          PY

      - name: Commit version updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/config.js service-worker.js

          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-version PWA [skip ci]"

            # Refresh against main before pushing. If main moves during the
            # push, rebase and retry rather than losing the version update.
            for attempt in 1 2 3 4 5; do
              git fetch origin main

              if ! git rebase origin/main; then
                echo "ERROR: Rebase failed. No remote changes have been overwritten."
                git rebase --abort || true
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "Version update pushed successfully."
                exit 0
              fi

              echo "Push attempt $attempt failed; retrying against latest main..."
              sleep 2
            done

            echo "ERROR: Could not push version update after 5 attempts."
            exit 1
          fi
