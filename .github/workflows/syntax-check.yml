
name: PWA Versioning and Syntax Check

concurrency:
  group: club-check-in-main-versioning
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check index.html JavaScript
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          scripts = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              html,
              re.DOTALL | re.IGNORECASE
          )

          for i, script in enumerate(scripts, 1):
              result = subprocess.run(
                  ["node", "--check"],
                  input=script,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  print(f"JavaScript syntax error in script block {i}:")
                  print(result.stderr)
                  sys.exit(1)

          print(f"JavaScript syntax check passed ({len(scripts)} script blocks checked).")
          PY

      - name: Safely increment and push PWA versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Always build the version commit on the latest main. Never rebase a
          # stale generated version commit over another version change.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python3 - <<'PY'
          import re
          import sys

          config_path = "js/config.js"
          worker_path = "service-worker.js"

          with open(config_path, "r", encoding="utf-8") as f:
              config = f.read()

          version_pattern = r"(const\s+APP_VERSION\s*=\s*['\"]V)(\d+)\.(\d+)\.(\d+)(['\"];)"

          def increment_version(match):
              major, minor, patch = map(int, match.group(2, 3, 4))
              if patch >= 9:
                  patch = 0
                  minor += 1
                  if minor >= 10:
                      minor = 0
                      major += 1
              else:
                  patch += 1
              return f"{match.group(1)}{major}.{minor}.{patch}{match.group(5)}"

          config_updated, config_count = re.subn(version_pattern, increment_version, config, count=1)
          if config_count != 1:
              sys.exit("ERROR: Could not find APP_VERSION in js/config.js")

          with open(worker_path, "r", encoding="utf-8") as f:
              worker = f.read()

          cache_pattern = r"(const\s+CACHE_NAME\s*=\s*['\"]club-check-in-v)(\d+)(['\"];)"
          worker_updated, worker_count = re.subn(
              cache_pattern,
              lambda m: f"{m.group(1)}{int(m.group(2)) + 1:03d}{m.group(3)}",
              worker,
              count=1
          )
          if worker_count != 1:
              sys.exit("ERROR: Could not find CACHE_NAME in service-worker.js")

          with open(config_path, "w", encoding="utf-8") as f:
              f.write(config_updated)
          with open(worker_path, "w", encoding="utf-8") as f:
              f.write(worker_updated)

          print("Prepared", re.search(version_pattern, config_updated).group(0))
          print("Prepared", re.search(cache_pattern, worker_updated).group(0))
          PY

            git add js/config.js service-worker.js

            if git diff --cached --quiet; then
              echo "No version changes required."
              exit 0
            fi

            git commit -m "chore: auto-version PWA [skip ci]"

            if git push origin HEAD:main; then
              echo "Version update pushed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; rebuilding from latest main..."
            sleep 2
          done

          echo "ERROR: Could not push version update after 5 attempts."
          exit 1
