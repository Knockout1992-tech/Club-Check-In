   CLUB CHECK-IN
   ========================================================= */

/* =========================================================
   STORAGE / DATE HELPERS
   ========================================================= */

function getTodayKey() {

    const now = new Date();

    return now.getFullYear()
        + "-"
        + String(now.getMonth() + 1).padStart(2, "0")
        + "-"
        + String(now.getDate()).padStart(2, "0");

}

function getDisplayDate(dateKey) {

    const parts = dateKey.split("-");

    return parts[2] + "/" + parts[1] + "/" + parts[0];

}

function getDaysSinceDate(dateKey) {

    if (!dateKey) {
        return null;
    }

    const last =
        new Date(dateKey + "T00:00:00");

    const today =
        new Date(getTodayKey() + "T00:00:00");

    const difference =
        today.getTime() - last.getTime();

    return Math.floor(
        difference / 86400000
    );

}

function getWeeksSinceDate(dateKey) {

    const days =
        getDaysSinceDate(dateKey);

    if (days === null) {
        return null;
    }

    return Math.floor(days / 7);

}

function isArchiveReviewDue(player) {

    if (!player.active || player.archived) {
        return false;
    }

    if (!player.lastAttendanceDate) {
        return false;
    }

    return getDaysSinceDate(
        player.lastAttendanceDate
    ) >= 84;

}

/* =========================================================
   PLAYER FINDER
   ========================================================= */

function findPlayerByID(playerID) {

    for (const ageGroup of ageGroups) {

        if (!players[ageGroup]) {
            continue;
        }

        const player =
            players[ageGroup].find(
                player =>
                    String(player.id) === String(playerID)
            );

        if (player) {
            return player;
        }

    }

    return null;

}

/* =========================================================
   ACTIVE PLAYERS
   ========================================================= */

function getActivePlayers(ageGroup) {

    if (!players[ageGroup]) {
        return [];
    }

    return players[ageGroup]
        .filter(player =>
            player.active &&
            !player.archived
        );

}

function getAllActivePlayers() {

    let result = [];

    ageGroups.forEach(ageGroup => {

        getActivePlayers(ageGroup)
            .forEach(player => {

                result.push(player);

            });

    });

    return result;

}

/* =========================================================
   GENERAL HELPERS
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function getNextAgeGroup(ageGroup) {

    const currentGroup =
        ageGroupData.find(
            group => group.age_group === ageGroup
        );

    if (!currentGroup) {
        return null;
    }

    if (!currentGroup.next_age_group_id) {
        return null;
    }

    const nextGroup =
        ageGroupData.find(
            group =>
                group.id ===
                currentGroup.next_age_group_id
        );

    if (!nextGroup) {
        return null;
    }

    return nextGroup.age_group;
}

/* =========================================================
   SHELL
   ========================================================= */

function renderShell(
    content,
    showHome = true
) {

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="app-header">

            <div class="brand">

                <img
                    src="RHRFC.jpg"
                    alt="RHRFC">

                <div>

                    <div class="brand-title">
                        CLUB CHECK-IN
                    </div>

                    <div class="brand-season">
                        Season ${currentSeason}
                    </div>

                </div>

            </div>

            ${
                showHome
                ? `

                    <div class="header-actions">

                        <button
                            class="header-button"
                            onclick="goHome()">

                            Home

                        </button>

                        <button
                            class="header-button"
                            onclick="logout()">

                            Logout

                        </button>

                    </div>

                `
                : ""
            }

        </div>

        <main class="page">

            ${content}

        </main>

    `;

}

/* =========================================================
   WELCOME
   ========================================================= */

function goHome() {

    if (
        currentRole === "coach"
    ) {

        currentAgeGroup = null;
        selectedAgeGroups = [];

        showCoachAgeGroups();

        return;

    }

    if (
        currentRole === "senior"
    ) {

        showSeniorDashboard();

        return;

    }

    showWelcome();

}


function logout() {

    currentRole = null;

    currentAgeGroup = null;

    selectedAgeGroups = [];

    showWelcome();

}

function showWelcome() {

    currentRole = null;
    currentAgeGroup = null;
    selectedAgeGroups = [];

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="welcome">

            <div class="welcome-card">

                <img
                    src="RHRFC.jpg"
                    class="welcome-logo"
                    alt="Rushden & Higham RUFC">

                <div class="welcome-title">
                    CLUB CHECK-IN
                </div>

                <div class="welcome-club">
                    Rushden & Higham RUFC
                </div>

                <button
                    class="role-button"
                    onclick="showPIN('coach')">

                    Coach

                </button>

                <button
                    class="role-button"
                    onclick="showPIN('senior')">

                    Senior Member

                </button>

                <div class="welcome-version">
                    ${APP_VERSION}
                </div>

            </div>

        </div>

    `;

}

/* =========================================================
   PIN
   ========================================================= */

function showPIN(role) {

    currentRole = role;

    const roleName =
        role === "coach"
        ? "Coach"
        : "Senior Member";

    renderShell(`

        <div class="card pin-card">

            <button
                class="back-button"
                onclick="showWelcome()">

                ← Back

            </button>

            <h2>
                ${roleName} Access
            </h2>

            <div class="subtitle">

                Enter your PIN to continue.

            </div>

            <input
                id="pinInput"
                class="pin-input"
                type="password"
                inputmode="numeric"
                maxlength="8"
                autocomplete="off">

            <div
                id="pinError"
                class="error">
            </div>

            <button
                class="primary-button"
                onclick="checkPIN()">

                Continue

            </button>

        </div>

    `);

    document.getElementById(
        "pinInput"
    ).focus();

}

function checkPIN() {

    const entered =
        document.getElementById(
            "pinInput"
        ).value;

    if (
        currentRole === "coach" &&
        entered === coachPIN
    ) {

        showCoachAgeGroups();

        return;

    }

    if (
        currentRole === "senior" &&
        entered === seniorPIN
    ) {

        showSeniorDashboard();

        return;

    }

    document.getElementById(
        "pinError"
    ).textContent =
        "Incorrect PIN.";

}

/* =========================================================
   COACH AGE GROUP SELECTION
   ========================================================= */

function showCoachAgeGroups() {

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showWelcome()">

                ← Back

            </button>

            <h2>
                Select Age Groups
            </h2>

            <div class="subtitle">

                Select one or more teams. You can manage
                several age groups in one register.

            </div>

            <div class="multi-age-summary">

                <strong>
                    Selected:
                </strong>

                ${
                    selectedAgeGroups.length
                    ? escapeHTML(
                        selectedAgeGroups.join(
                            " + "
                        )
                    )
                    : "None selected"
                }

            </div>

            <div class="age-grid">

                ${
                    getActiveAgeGroups().map(age => {

                        const selected =
                            selectedAgeGroups
                                .includes(age);

                        return `

                            <button
                                class="
                                    age-button
                                    ${
                                        selected
                                        ? "selected-age"
                                        : ""
                                    }
                                "
                                onclick="
                                    toggleCoachAgeGroup(
                                        '${age}'
                                    )
                                ">

                                ${age}

                            </button>

                        `;

                    }).join("")
                }

            </div>

            <br>

            <div class="multi-age-actions">

                <button
                    class="secondary-button"
                    onclick="
                        selectCoachAgeGroups(
                         getActiveAgeGroups()
                        )
                    ">

                    Select All

                </button>

                <button
                    class="secondary-button"
                    onclick="
                        selectedAgeGroups = [];
                        currentAgeGroup = null;
                        showCoachAgeGroups();
                    ">

                    Clear

                </button>

            </div>

            <button
                class="primary-button"
                onclick="
                    openSelectedCoachAgeGroups()
                "
                ${
                    selectedAgeGroups.length === 0
                    ? "disabled"
                    : ""
                }>

                Continue

            </button>

        </div>

    `);

}

function toggleCoachAgeGroup(
    ageGroup
) {

    if (
        selectedAgeGroups.includes(
            ageGroup
        )
    ) {

        selectedAgeGroups =
            selectedAgeGroups.filter(
                age =>
                    age !== ageGroup
            );

    } else {

        selectedAgeGroups.push(
            ageGroup
        );

        selectedAgeGroups =
            ageGroups.filter(
                age =>
                    selectedAgeGroups
                        .includes(age)
            );

    }

    showCoachAgeGroups();

}

function selectCoachAgeGroups(
    groups
) {

    selectedAgeGroups =
        [...groups];

    showCoachAgeGroups();

}

function openSelectedCoachAgeGroups() {

    if (
        selectedAgeGroups.length === 0
    ) {

        alert(
            "Please select at least one age group."
        );

        return;

    }

    currentAgeGroup =
        selectedAgeGroups[0];

    showCoachDashboard();

}

/* =========================================================
   COACH DASHBOARD
   ========================================================= */

function showCoachDashboard() {

    const groups =
        selectedAgeGroups.length
        ? selectedAgeGroups
        : [currentAgeGroup];

    let activeCount = 0;
    let presentCount = 0;

    groups.forEach(ageGroup => {

        const active =
            getActivePlayers(
                ageGroup
            );

        const register =
            getTodayRegister(
                ageGroup
            );

        activeCount +=
            active.length;

        if (register) {

            presentCount +=
                active.filter(
                    player =>
                        register.attendance[
                            player.id
                        ] === true
                ).length;

        }

    });

    const absentCount =
        activeCount -
        presentCount;

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showCoachAgeGroups()">

                ← Age Groups

            </button>

            <h2>
                ${
                    groups.length === 1
                    ? groups[0]
                    : "Multiple Age Groups"
                }
            </h2>

            <div class="subtitle">

                ${
                    groups.join(
                        " + "
                    )
                }

                <br>

                Coach Dashboard

            </div>

            <div class="stats">

                <div class="stat">

                    <div class="stat-number">
                        ${activeCount}
                    </div>

                    <div class="stat-label">
                        Players
                    </div>

                </div>

                <div class="stat">

                    <div class="stat-number">
                        ${presentCount}
                    </div>

                    <div class="stat-label">
                        Present
                    </div>

                </div>

                <div class="stat">

                    <div class="stat-number">
                        ${absentCount}
                    </div>

                    <div class="stat-label">
                        Absent
                    </div>

                </div>

            </div>

            <div class="menu-grid">

                <button
                    class="menu-button"
                    onclick="showRegister()">

                    Today's<br>
                    Register

                </button>

                <button
                    class="menu-button"
                    onclick="showRoster()">

                    Roster

                </button>

                <button
                    class="menu-button"
                    onclick="showSessionHistory()">

                    Session<br>
                    History

                </button>

            </div>

        </div>

    `);

}

/* =========================================================
   MULTI-AGE REGISTER
   ========================================================= */

async function showRegister() {

    const groups =
        selectedAgeGroups.length
        ? selectedAgeGroups
        : [currentAgeGroup];

    for (const ageGroup of groups) {

        if (!getTodayRegister(ageGroup)) {

            await ensureTodayAttendanceRegister(
                ageGroup
            );

        }

    }

    const registerExists =
        groups.some(
            ageGroup =>
                getTodayRegister(
                    ageGroup
                )
        );

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showCoachDashboard()">

                ← Back

            </button>

            <h2>
                Today's Register
            </h2>

            <div class="subtitle">

                ${groups.join(" + ")}

                ·

                ${getDisplayDate(
                    getTodayKey()
                )}

            </div>

            ${
                !registerExists

                ? `

                    <div class="info-box">

                        Today's registers have not been
                        opened yet.

                        <br><br>

                        Opening the register will create
                        one register for each selected
                        age group.

                    </div>

                    <button
                        class="primary-button"
                        onclick="
                            openTodayRegister()
                        ">

                        Take Register

                    </button>

                `

                : `

                    <div class="
                        register-status
                        register-open
                    ">

                        Register open — you can
                        edit it throughout today.

                    </div>

                    ${
                        groups.map(
                            ageGroup => {

                                const register =
                                    getTodayRegister(
                                        ageGroup
                                    );

                                const active =
                                    getActivePlayers(
                                        ageGroup
                                    );

                                if (!register) {

                                    return `

                                        <div
                                            class="
                                                info-box
                                                warning-box
                                            ">

                                            ${ageGroup} register
                                            has not been opened.

                                            <br><br>

                                            <button
                                                class="
                                                    secondary-button
                                                "
                                                onclick="
                                                    openAgeGroupRegister(
                                                        '${ageGroup}'
                                                    )
                                                ">

                                                Open ${ageGroup}

                                            </button>

                                        </div>

                                    `;

                                }

                                return `

                                    <div class="age-section">

                                        <div class="
                                            age-section-title
                                        ">

                                            <span>
                                                ${ageGroup}
                                            </span>

                                            <span
                                                class="
                                                    age-section-count
                                                ">

                                                ${active.length}
                                                player${
                                                    active.length === 1
                                                    ? ""
                                                    : "s"
                                                }

                                            </span>

                                        </div>

                                        ${
                                            active.length === 0

                                            ? `

                                                <div class="empty">

                                                    No active players.

                                                </div>

                                            `

                                            : active.map(
                                                player => {

                                                    const present =
                                                        register.attendance[
                                                            player.id
                                                        ] === true;

                                                    return `

                                                        <div
                                                            class="
                                                                player-row
                                                            ">

                                                            <div
                                                                class="
                                                                    player-info
                                                                ">

                                                                <div
                                                                    class="
                                                                        player-name
                                                                    ">

                                                                    ${escapeHTML(
                                                                        player.name
                                                                    )}

                                                                </div>

                                                            </div>

                                                            <label
                                                                class="
                                                                    toggle
                                                                    ${
                                                                        present
                                                                        ? "present"
                                                                        : "absent"
                                                                    }
                                                                ">

                                                               <input
    type="checkbox"
    data-player-id="${escapeHTML(player.id)}"
    ${
        present
        ? "checked"
        : ""
    }
    onchange="setAttendance(this.dataset.playerId, this.checked)"
>

                                                                <span
                                                                    class="
                                                                        toggle-knob
                                                                    ">
                                                                </span>

                                                                <span
                                                                    class="
                                                                        toggle-label
                                                                    ">

                                                                    ${
                                                                        present
                                                                        ? "PRESENT"
                                                                        : "ABSENT"
                                                                    }

                                                                </span>

                                                            </label>

                                                        </div>

                                                    `;

                                                }
                                            ).join("")
                                        }

                                    </div>

                                `;

                            }
                        ).join("")
                    }

                    <br>

                    <button
                        class="green-button"
                        onclick="
                            showCoachAddPlayer()
                        ">

                        + Add Player

                    </button>

                    <br><br>

                    <button
                        class="primary-button"
                        onclick="
                            saveSession()
                        ">

                        Save Today's Registers

                    </button>

                `

            }

        </div>

    `);

}
/* =========================================================
   ROSTER
   ========================================================= */

                    return `

            <div class="info-box">

/* =========================================================
   COACH ADD / RESTORE PLAYER
   ========================================================= */

function showCoachAddPlayer(
    fromRoster = false,
    rosterAgeGroup = null
) {

    const groups =
        rosterAgeGroup
        ? [rosterAgeGroup]
        : (
            selectedAgeGroups.length
            ? selectedAgeGroups
            : [currentAgeGroup]
        );

    const ageGroupSelector =
        groups.length > 1
        ? `

            <div class="form-group">

                <label
                    class="title"
                    for="targetAgeGroup">

                    Add / Restore to:

                </label>

                <select
                    id="targetAgeGroup"
                    class="text-input">

                    ${
                        groups.map(
                            (age, index) =>
                                `<option
                                    value="${age}"
                                    ${index === 0 ? "selected" : ""}>
                                    ${age}
                                </option>`
                        ).join("")
                    }

                </select>

            </div>

        `
        : "";

    renderShell(`

        <div class="card">

                <button
                    class="back-button"
                    onclick="
                        ${
                            fromRoster
                            ? "showRoster()"
                            : "showRegister()"
                        }
                    ">
                
                    ← ${
                        fromRoster
                        ? "Roster"
                        : "Register"
                    }
            </button>

            <h2>
                Add Player
            </h2>

            <div class="subtitle">

                Add a new player or search the archive
                for a returning player.

            </div>

            ${ageGroupSelector}

            <div class="info-box">

                If this player has previously been archived,
                search for them below and restore their
                existing record instead of creating a duplicate.

            </div>

            <div class="form-group">

                <label
                    class="title">

                    Player Name

                </label>

                <input
                    id="coachPlayerName"
                    class="text-input"
                    maxlength="100"
                    autocomplete="off"
                    oninput="
                        searchArchivedPlayers(
                            ${fromRoster}
                        )
                    ">

            </div>

            <div id="archiveSearchResults"></div>

            <br>

            <button
                class="green-button"
                onclick="
                    coachAddPlayer(
                        ${fromRoster},
                        '${rosterAgeGroup || ""}'
                    )
                ">

                Add as New Player

            </button>

        </div>

    `);

    document.getElementById(
        "coachPlayerName"
    ).focus();

}

async function coachAddPlayer(
    fromRoster = false,
    rosterAgeGroup = null
) {

    const name =
        document.getElementById(
            "coachPlayerName"
        ).value.trim();

    if (!name) {

        alert(
            "Please enter a player name."
        );

        return;
    }

    const groups =
        rosterAgeGroup
        ? [rosterAgeGroup]
        : (
            selectedAgeGroups.length
            ? selectedAgeGroups
            : [currentAgeGroup]
        );

    if (!groups.length) {

        alert(
            "Please select an age group first."
        );

        return;
    }

    let targetAgeGroup =
        groups[0];

    if (groups.length > 1) {

        const select =
            document.getElementById(
                "targetAgeGroup"
            );

        if (!select || !select.value) {

            alert(
                "Please select an age group."
            );

            return;
        }

        targetAgeGroup =
            select.value;
    }

    /*
        Find players with the same name
        across all age groups.
    */

    const matchingPlayers = [];

    ageGroups.forEach(
        ageGroup => {

            (players[ageGroup] || [])
                .forEach(
                    player => {

                        if (
                            player.name &&
                            player.name
                                .trim()
                                .toLowerCase() ===
                            name.toLowerCase()
                        ) {

                            matchingPlayers.push({

                                player:
                                    player,

                                ageGroup:
                                    ageGroup

                            });
                        }
                    }
                );
        }
    );

    /*
        Check for an archived match first.
    */

    const archivedMatch =
        matchingPlayers.find(
            match =>
                match.player.archived === true
        );

    if (archivedMatch) {

        const restore =
            confirm(
                name +
                " is already recorded as an archived player " +
                "in " +
                archivedMatch.ageGroup +
                ".\n\n" +
                "Would you like to restore their existing record " +
                "to " +
                targetAgeGroup +
                "?"
            );

        if (restore) {

            await restoreArchivedPlayer(
                archivedMatch.player.id,
                fromRoster,
                targetAgeGroup
            );
        }

        return;
    }

    /*
        Check for an active match.
    */

    const activeMatch =
        matchingPlayers.find(
            match =>
                match.player.active === true &&
                match.player.archived !== true
        );

    if (activeMatch) {

        if (
            activeMatch.ageGroup ===
            targetAgeGroup
        ) {

            alert(
                name +
                " is already registered in " +
                targetAgeGroup +
                ".\n\n" +
                "A duplicate player has not been created."
            );

            return;
        }

        const differentPlayer =
            confirm(
                name +
                " is already registered in " +
                activeMatch.ageGroup +
                ".\n\n" +
                "You are trying to add them to " +
                targetAgeGroup +
                ".\n\n" +
                "If this is the same player, cancel.\n\n" +
                "If this is a different player with the same name, " +
                "press OK to continue."
            );

        if (!differentPlayer) {

            return;
        }
    }

    /*
        ROSTER:
        Add the player without requiring today's
        register and without marking them present.
    */

    if (fromRoster) {

        const newPlayer =
            await addPlayerToAgeGroup(
                targetAgeGroup,
                name,
                false
            );

        if (!newPlayer) {
            return;
        }

        showRoster();

        return;
    }

    /*
        REGISTER:
        Today's register must be open.
    */

    const register =
        getTodayRegister(
            targetAgeGroup
        );

    if (
        !register ||
        register.submitted
    ) {

        alert(
            "Today's register is not open for "
            + targetAgeGroup
            + "."
        );

        return;
    }

    /*
        Create the new player.
    */

    const newPlayer =
        await addPlayerToAgeGroup(
            targetAgeGroup,
            name,
            false
        );

    if (!newPlayer) {
        return;
    }

    /*
        A player added during today's register
        is automatically marked as attending.

        Backend attendance will be wired during
        the Attendance migration.
    */

    const addedToRegister =
    await addPlayerToTodayAttendance(
        targetAgeGroup,
        newPlayer.id
    );

if (!addedToRegister) {
    return;
}

await setAttendance(
    newPlayer.id,
    true
);

showRegister();
}

${

   ========================================================= */

async function showSessionHistory() {

    const groups =
        selectedAgeGroups.length
        ? selectedAgeGroups
        : [currentAgeGroup];

    const { data: registers, error } =
        await supabaseClient
            .from("attendance_registers")
            .select(`
                id,
                register_date,
                age_group,
                submitted,
                closed_automatically
            `)
            .in(
                "age_group",
                groups
            )
            .order(
                "register_date",
                {
                    ascending: false
                }
            );

    if (error) {

        console.error(
            "Supabase session history load failed:",
            error
        );

        alert(
            "Unable to load session history. Please try again."
        );

        return;
    }


    /* -----------------------------------------------------
       LOAD ATTENDANCE RECORDS
       ----------------------------------------------------- */

    let attendanceRecords = [];

    if (registers.length) {

        const registerIDs =
            registers.map(
                register => register.id
            );

        const {
            data,
            error
        } =
            await supabaseClient
                .from("attendance_records")
                .select(`
                    register_id,
                    player_id,
                    present
                `)
                .in(
                    "register_id",
                    registerIDs
                );

        if (error) {

            console.error(
                "Supabase session attendance load failed:",
                error
            );

            alert(
                "Unable to load session attendance. Please try again."
            );

            return;
        }

        attendanceRecords =
            data || [];
    }


    /* -----------------------------------------------------
       RENDER
       ----------------------------------------------------- */

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showCoachDashboard()">

                ← Back

            </button>

            <h2>
                Session History
            </h2>

            <div class="subtitle">

                ${groups.join(" + ")}

            </div>

            ${
                groups.map(
                    ageGroup => {

                    const groupRegisters =
                        registers.filter(
                            register =>
                                register.age_group ===
                                ageGroup
                        );

                    if (
                        groupRegisters.length === 0
                    ) {

                        return `

                            <div class="info-box">

                                No session history
                                available.

                            </div>

                        `;

                    }

                    return `

                        <h3>
                            ${ageGroup}
                        </h3>

                        ${
                            groupRegisters.map(
                                register => {

                                const records =
                                    attendanceRecords.filter(
                                        record =>
                                            record.register_id ===
                                            register.id
                                    );

                                const presentCount =
                                    records.filter(
                                        record =>
                                            record.present === true
                                    ).length;

                                const totalCount =
                                    records.length;

                                let status =
                                    "In Progress";

                                if (
                                    register.closed_automatically
                                ) {

                                    status =
                                        "Automatically Closed";

                                } else if (
                                    register.submitted
                                ) {

                                    status =
                                        "Submitted";

                                }

                                const date =
                                    new Date(
                                        register.register_date
                                    ).toLocaleDateString(
                                        "en-GB"
                                    );

                                return `

                                    <div
                                        class="
                                            promotion-row
                                        ">

                                        <span>

                                            ${date}

                                            <br>

                                            ${presentCount}
                                            of
                                            ${totalCount}
                                            present

                                        </span>

                                        <strong>

                                            ${status}

                                        </strong>

                                    </div>

                                `;

                            }).join("")
                        }

                    `;

                }).join("")
            }

        </div>

    `);

}

                                player.coachGmsSuggestion && !player.gms
                                ? `
                                    <div
                                        class="player-small">

                                        Coach has suggested GMS

                                    </div>
                                `
                                : ""
                            }

                            <div
                                class="player-small">

                                Last attended:
                                ${
                                    player.lastAttendanceDate
                                    ? new Date(
                                        player.lastAttendanceDate
                                    ).toLocaleDateString(
                                        "en-GB"
                                    )
                                    : "No attendance recorded"
                                }

                            </div>

                        </div>

                        <div
                            class="row-actions">

                            <label
                                class="
                                    toggle
                                    gms-toggle
                                    ${
                                        player.gms
                                        ? "confirmed"
                                        : "not-confirmed"
                                    }
                                ">

                                <input
                                    type="checkbox"
                                    ${
                                        player.gms
                                        ? "checked"
                                        : ""
                                    }
                                    onchange='
                                        setGMS(
                                            ${JSON.stringify(player.id)},
                                            this.checked
                                        )
                                    '>

                                <span
                                    class="toggle-knob">
                                </span>

                                <span
                                    class="toggle-label">
                                </span>

                            </label>

                            <button
                                class="
                                    secondary-button
                                    small-button
                                "
                                onclick='
                                    showMovePlayer(
                                        ${JSON.stringify(player.id)}
                                    )
                                '>

                                Move

                            </button>

                            <button
                                class="
                                    red-button
                                    small-button
                                "
                                onclick='
                                    archivePlayer(
                                        ${JSON.stringify(player.id)},
                                        "playerManagement"
                                    )
                                '>

                                Archive

                            </button>

                        </div>

                    </div>

                `
                ).join("")
            }

            <br>

            <button
                class="green-button"
                onclick="
                    showSeniorAddPlayer(
                        '${ageGroup}'
                    )
                ">

                Add Player

            </button>

        </div>

    `;

}

function showMovePlayer(
    playerID
) {

    const player =
        findPlayerByID(
            playerID
        );

    if (!player) {
        return;
    }

    const availableGroups =
        ageGroups.filter(
            ageGroup =>
                ageGroup !== player.ageGroup
        );

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="
                    showPlayerManagement(
                        '${player.ageGroup}'
                    )
                ">

                ← Back

            </button>

            <h2>
                Move Player
            </h2>

            <div class="subtitle">

                ${escapeHTML(
                    player.name
                )}

            </div>

            <div class="info-box">

                Current age group:
                <strong>
                    ${player.ageGroup}
                </strong>

                <br><br>

                Select the new age group for this player.

                Their Player ID and attendance history
                will be retained.

            </div>

            <div class="form-group">

                <label
                    class="title"
                    for="moveTargetAgeGroup">

                    Move to:

                </label>

                <select
                    id="moveTargetAgeGroup"
                    class="text-input">

                    ${
                        availableGroups.map(
                            ageGroup => `

                                <option
                                    value="${ageGroup}">

                                    ${ageGroup}

                                </option>

                            `
                        ).join("")
                    }

                </select>

            </div>

            <button
                class="green-button"
                onclick='
    movePlayer(
        ${JSON.stringify(player.id)}
    )
'>

                Move Player

            </button>

        </div>

    `);

}
   
/* =========================================================
   SENIOR ADD PLAYER
   ========================================================= */

function showSeniorAddPlayer(
    ageGroup
) {

    currentAgeGroup =
        ageGroup;

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="
                    showPlayerManagement(
                        '${ageGroup}'
                    )
                ">

                ← Back

            </button>

            <h2>
                Add Player
            </h2>

            <div class="subtitle">
                ${ageGroup}
            </div>

            <div class="form-group">

                <label class="title">
                    Player Name
                </label>

                <input
                    id="seniorPlayerName"
                    class="text-input"
                    maxlength="100"
                    autocomplete="off">

            </div>

            <div class="form-group">

                <label class="title">
                    GMS Status
                </label>

                <label
                    id="newGMSToggle"
                    class="
                        toggle
                        gms-toggle
                        not-confirmed
                    ">

                    <input
                        id="newGMS"
                        type="checkbox"
                        onchange="
                            updateNewGMSToggle()
                        ">

                    <span
                        class="toggle-knob">
                    </span>

                    <span
                        class="toggle-label">
                    </span>

                </label>

            </div>

            <button
                class="green-button"
                onclick="
                    seniorAddPlayer(
                        '${ageGroup}'
                    )
                ">

                Add Player

            </button>

        </div>

    `);

    document.getElementById(
        "seniorPlayerName"
    ).focus();

}

function updateNewGMSToggle() {

    const input =
        document.getElementById(
            "newGMS"
        );

    const toggle =
        document.getElementById(
            "newGMSToggle"
        );

    if (input.checked) {

        toggle.classList.remove(
            "not-confirmed"
        );

        toggle.classList.add(
            "confirmed"
        );

    } else {

        toggle.classList.remove(
            "confirmed"
        );

        toggle.classList.add(
            "not-confirmed"
        );

    }

}

async function seniorAddPlayer(
    ageGroup
) {

    const name =
        document.getElementById(
            "seniorPlayerName"
        ).value.trim();

    const gms =
        document.getElementById(
            "newGMS"
        ).checked;

    if (!name) {

        alert(
            "Please enter a player name."
        );

        return;
    }

    const newPlayer =
        await addPlayerToAgeGroup(
            ageGroup,
            name,
            gms
        );

    if (!newPlayer) {

        return;
    }

    showPlayerManagement(
        ageGroup
    );

}

/* =========================================================
   NEW SEASON
   ========================================================= */

function showNewSeason() {

    const nextSeason =
        getNextSeason(
            currentSeason
        );

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showSeniorDashboard()">

                ← Back

            </button>

            <h2>
                New Season
            </h2>

            <div class="subtitle">

                Review player progression before
                starting the new season.

            </div>

            <div class="
                info-box
                warning-box
            ">

                <strong>
                    Current season:
                </strong>

                ${currentSeason}

                <br><br>

                <strong>
                    New season:
                </strong>

                ${nextSeason}

            </div>

            <h3>
                Player Progression
            </h3>

            ${
                ageGroups
                    .map(
                        ageGroup => {

                        const count =
                            getActivePlayers(
                                ageGroup
                            ).length;

                        if (count === 0) {
                            return "";
                        }

                        const next =
                            getNextAgeGroup(
                                ageGroup
                            );

                        if (!next) {

                            return `

                                <div
                                    class="
                                        promotion-row
                                    ">

                                    <span>

                                        ${ageGroup}
                                        →
                                        Leaving Active Register

                                    </span>

                                    <strong>
                                        ${count}
                                    </strong>

                                </div>

                            `;

                        }

                        const nextGroup =
                            ageGroupData.find(
                                group =>
                                    group.age_group ===
                                    next
                            );

                        const nextActive =
                            nextGroup &&
                            nextGroup.active;

                        return `

                            <div
                                class="
                                    promotion-row
                                    ${
                                        !nextActive
                                        ? "warning-box"
                                        : ""
                                    }
                                ">

                                <span>

                                    ${ageGroup}
                                    →
                                    ${
                                        nextActive
                                        ? next
                                        : next +
                                          " — Leaving Active Register"
                                    }

                                </span>

                                <strong>
                                    ${count}
                                </strong>

                            </div>

                        `;

                    }).join("")
            }

            <br>

            <div class="
                info-box
                danger-box
            ">

                <strong>
                    Important
                </strong>

                <br><br>

                Players will move to their configured
                next age group only where that age group
                is currently active.

                <br><br>

                If the next age group is inactive, the
                player will leave the active register.

                <br><br>

                Players are not deleted. Their player
                record and history are retained.

            </div>

            <button
                class="blue-button"
                onclick="
                    confirmNewSeason()
                ">

                Confirm New Season

            </button>

        </div>

    `);

}


function confirmNewSeason() {

    const nextSeason =
        getNextSeason(
            currentSeason
        );

    const confirmed =
        confirm(
            "Start season "
            + nextSeason
            + "?\n\n"
            + "Players will move to the next active age group.\n"
            + "Those without one will leave the active register.\n\n"
            + "Player records and history will be retained."
                    );

    if (!confirmed) {
        return;
    }

    performNewSeason(
        nextSeason
    );

}

/* =========================================================
   PIN MANAGEMENT
   ========================================================= */

function showPINManagement() {

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showSeniorDashboard()">

                ← Back

            </button>

            <h2>
                Manage PINs
            </h2>

            <div class="subtitle">

                Senior Members can change both access PINs.

            </div>

            <div class="list-row">

                <div class="list-title">
                    Coach PIN
                </div>

                <div class="list-sub">

                    Used by coaches to access registers.

                </div>

                <br>

                <button
                    class="secondary-button"
                    onclick="
                        showChangePIN(
                            'coach'
                        )
                    ">

                    Change Coach PIN

                </button>

            </div>

            <div class="list-row">

                <div class="list-title">
                    Senior Member PIN
                </div>

                <div class="list-sub">

                    Used for full club access.

                </div>

                <br>

                <button
                    class="secondary-button"
                    onclick="
                        showChangePIN(
                            'senior'
                        )
                    ">

                    Change Senior Member PIN

                </button>

            </div>

        </div>

    `);

}

function showChangePIN(
    type
) {

    const title =
        type === "coach"
        ? "Change Coach PIN"
        : "Change Senior Member PIN";

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showPINManagement()">

                ← Back

            </button>

            <h2>
                ${title}
            </h2>

            <div class="form-group">

                <label class="title">
                    New PIN
                </label>

                <input
                    id="newPIN"
                    class="pin-input"
                    type="password"
                    inputmode="numeric"
                    maxlength="8">

            </div>

            <div class="form-group">

                <label class="title">
                    Confirm New PIN
                </label>

                <input
                    id="confirmPIN"
                    class="pin-input"
                    type="password"
                    inputmode="numeric"
                    maxlength="8">

            </div>

            <div
                id="changePINError"
                class="error">
            </div>

            <button
                class="green-button"
                onclick="
                    changePIN(
                        '${type}'
                    )
                ">

                Save New PIN

            </button>

        </div>

    `);

}

function changePIN(
    type
) {

    const newPIN =
        document.getElementById(
            "newPIN"
        ).value;

    const confirmPIN =
        document.getElementById(
            "confirmPIN"
        ).value;

    const error =
        document.getElementById(
            "changePINError"
        );

    error.textContent = "";

    if (
        !newPIN ||
        !confirmPIN
    ) {

        error.textContent =
            "Please enter and confirm the new PIN.";

        return;

    }

    if (
        newPIN !== confirmPIN
    ) {

        error.textContent =
            "The PINs do not match.";

        return;

    }

    if (
        !/^\d+$/.test(newPIN)
    ) {

        error.textContent =
            "PIN must contain numbers only.";

        return;

    }

    if (
        newPIN.length < 4
    ) {

        error.textContent =
            "PIN must be at least 4 digits.";

        return;

    }

    if (type === "coach") {

        coachPIN =
            newPIN;

    } else {

        seniorPIN =
            newPIN;

    }

    saveData();

    showPINManagement();

}
