html, body {

    background: #f5f5f5;
    color: #111;
}

body {
    min-height: 100vh;
}

button,
input {

button {

#app {

/* =========================

   ========================= */

    background: #000;

.brand {

}

.brand img {

    height: 42px;

}

.brand-title {
    font-size: 17px;
    font-weight: 700;
}

.brand-season {
    font-size: 11px;
    color: #bbb;
    margin-top: 2px;
}

.header-button {
    background: #333;
    border: 0;
    color: #fff;
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 12px;
}

/* =========================
   MAIN
   ========================= */

.page {
    max-width: 850px;
    margin: 0 auto;
    padding: 15px;
}

.card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
}

h1,
h2,
h3 {
    margin-top: 0;
}

h2 {
    font-size: 22px;
    margin-bottom: 6px;
}

.subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 18px;
}

.back-button {
    background: #e5e5e5;
    border: 0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 15px;
}

.primary-button {
    width: 100%;
    background: #000;
    color: #fff;
    border: 0;
    border-radius: 11px;
    padding: 16px;
    font-weight: 700;
    font-size: 16px;
}

.secondary-button {
    background: #ddd;
    color: #111;
    border: 0;
    border-radius: 9px;
    padding: 11px 14px;
    font-weight: 700;
}

.green-button {
    background: #198754;
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 11px 14px;
    font-weight: 700;
}

.red-button {
    background: #c82333;
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 10px 13px;
    font-weight: 700;
}

.blue-button {
    background: #0d6efd;
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 11px 14px;
    font-weight: 700;
}

.small-button {
    padding: 8px 11px;
    font-size: 12px;
}

/* =========================
   WELCOME
   ========================= */

.welcome {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 18px;
}

.welcome-card {
    width: 100%;
    max-width: 430px;
    text-align: center;
    background: #fff;
    border-radius: 18px;
    padding: 30px 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.welcome-logo {
    width: 135px;
    height: 135px;
    object-fit: contain;
    margin-bottom: 15px;
}

.welcome-title {
    font-size: 31px;
    font-weight: 800;
    margin-bottom: 5px;
}

.welcome-club {
    color: #666;
    margin-bottom: 28px;
}

.role-button {
    width: 100%;
    padding: 17px;
    margin-top: 10px;
    border: 0;
    border-radius: 11px;
    background: #000;
    color: #fff;
    font-weight: 700;
    font-size: 17px;
}

/* =========================
   PIN
   ========================= */

.pin-card {
    max-width: 420px;
    margin: 45px auto;
    text-align: center;
}

.pin-input {
    width: 100%;
    padding: 15px;
    text-align: center;
    font-size: 25px;
    letter-spacing: 7px;
    border: 1px solid #ccc;
    border-radius: 10px;
    margin: 15px 0;
}

.error {
    min-height: 22px;
    color: #c82333;
    font-weight: 700;
    margin-bottom: 8px;
}

/* =========================
   AGE GROUPS
   ========================= */

.age-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

.age-button {
    background: #111;
    color: #fff;
    border: 0;
    border-radius: 11px;
    padding: 19px 8px;
    font-size: 18px;
    font-weight: 700;
    box-shadow: none;
}

.age-button.gms-needs-confirmation {
    background: #d6a900;
    color: #111;
}

.age-button.selected-age {
    background: #198754;
    color: #fff;
}

/* =========================
   DASHBOARD
   ========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 15px 0;
}

.stat {
    background: #f0f0f0;
    border-radius: 10px;
    padding: 13px 7px;
    text-align: center;
}

.stat-number {
    font-size: 25px;
    font-weight: 800;
}

.stat-label {
    color: #666;
    font-size: 11px;
    margin-top: 3px;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.menu-button {
    min-height: 82px;
    border: 0;
    border-radius: 12px;
    background: #111;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 12px;
    box-shadow: none;
}

.menu-button.blue {
    background: #0d6efd;
}

/* =========================
   PLAYER ROW
   ========================= */

.player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid #e0e0e0;
}

.player-row:last-child {
    border-bottom: 0;
}

.player-name {
    font-weight: 700;
}

.player-info {
    flex: 1;
    min-width: 0;
}

.player-small {
    color: #777;
    font-size: 12px;
    margin-top: 3px;
}

.row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.gms-count {
    font-size: 12px;
    font-weight: 600;
    opacity: 0.7;
}

.player-management-row {
    flex-direction: row !important;
    align-items: center !important;
}

/* =========================
   SLIDE TOGGLES
   ========================= */

.toggle {
    position: relative;
    display: inline-flex;
    width: 108px;
    height: 38px;
    border-radius: 30px;
    cursor: pointer;
    overflow: hidden;
    flex-shrink: 0;
}

.toggle input {
    display: none;
}

.toggle-knob {
    position: absolute;
    top: 4px;
    width: 30px;
    height: 30px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    transition: left .18s ease;
    z-index: 2;
}

.toggle-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    z-index: 3;
}

.toggle.present,
.toggle.confirmed {
    background: #198754;
}

.toggle.absent,
.toggle.not-confirmed {
    background: #c82333;
}

.toggle.present .toggle-knob,
.toggle.confirmed .toggle-knob {
    left: 74px;
}

.toggle.absent .toggle-knob,
.toggle.not-confirmed .toggle-knob {
    left: 4px;
}

.toggle.present .toggle-label {
    justify-content: flex-start;
    padding-left: 10px;
}

.toggle.absent .toggle-label {
    justify-content: flex-end;
    padding-right: 9px;
}

.toggle.gms-toggle .toggle-label {
    display: none;
}

.toggle.gms-toggle {
    width: 54px;
    height: 30px;
}

.toggle.gms-toggle .toggle-knob {
    width: 22px;
    height: 22px;
    top: 4px;
}

.toggle.gms-toggle.confirmed .toggle-knob {
    left: 28px;
}

.toggle.gms-toggle.not-confirmed .toggle-knob {
    left: 4px;
}

.toggle.gms-toggle.locked {
    opacity: 0.55;
    cursor: default;
}

/* =========================
   REGISTER STATUS
   ========================= */

.register-status {
    padding: 11px 13px;
    border-radius: 9px;
    margin-bottom: 15px;
    font-size: 13px;

.register-open {

.gms-suggestion-label {

    background: #eee;
    font-size: 14px;
}

.warning-box {

    color: #664d03;

}

.danger-box {
    background: #f8d7da;
    color: #842029;
    border: 1px solid #f1aeb5;
}

.success-box {
    background: #d1e7dd;
    color: #0f5132;
    border: 1px solid #a3cfbb;

/* =========================

.list-row:last-child {
    border-bottom: 0;
}

.list-title {
    font-weight: 700;
}

.list-sub {
    color: #666;
    font-size: 13px;
    margin-top: 3px;
}

.promotion-row {

    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid #ddd;
}

.promotion-row:last-child {
    border-bottom: 0;
}

.empty {

    color: #777;
    padding: 25px 10px;

/* =========================

.age-section {
    margin-top: 20px;

.age-section:first-child {

}

.age-section-title {

    justify-content: space-between;
    align-items: center;
    background: #111;

    padding: 11px 13px;
    border-radius: 9px;
    font-weight: 700;

.age-section-warning {

}

.age-section-count {

    font-weight: 700;
}

.archive-age-title {
    background: #555;
}

.archive-due {
    background: #fff3cd;
    color: #664d03;
    border: 1px solid #ffe69c;

/* =========================

    background: #eee;
    border-radius: 9px;
    margin: 15px 0;
    font-size: 14px;
}

.multi-age-summary strong {
    display: block;
    margin-bottom: 4px;
}

.multi-age-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 520px) {

    .page {
        padding: 10px;
    }

    .card {
        border-radius: 12px;
        padding: 15px;
    }

    .age-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 13px;
    }

    .age-button {
        padding: 17px 5px;
        font-size: 17px;
    }

    .menu-grid {
        grid-template-columns: 1fr 1fr;
        gap: 13px;
    }

    .menu-button {
        min-height: 75px;
        font-size: 14px;
    }

    .player-row {
        align-items: center;
        flex-direction: row;
    }

    .row-actions {
        width: auto;
        justify-content: flex-end;
    }

    .player-management-row {
        flex-direction: row !important;
        align-items: center !important;
    }
}

@media (max-width: 360px) {

    .age-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: 1fr 1fr 1fr;
    }

    .stat-number {
        font-size: 21px;
    }
}

/* =========================================================
   STORAGE / DATE HELPERS
   ========================================================= */

function getTodayKey() {

    const now = new Date();

    return now.getFullYear()
        + "-"
        + String(now.getMonth() + 1).padStart(2, "0")
        + "-"
        + String(now.getDate()).padStart(2, "0");

}

function getDisplayDate(dateKey) {

    const parts = dateKey.split("-");

    return parts[2] + "/" + parts[1] + "/" + parts[0];

}

function getDaysSinceDate(dateKey) {

    if (!dateKey) {
        return null;
    }

    const last =
        new Date(dateKey + "T00:00:00");

    const today =
        new Date(getTodayKey() + "T00:00:00");

    const difference =
        today.getTime() - last.getTime();

    return Math.floor(
        difference / 86400000
    );

}

function getWeeksSinceDate(dateKey) {

    const days =
        getDaysSinceDate(dateKey);

    if (days === null) {
        return null;
    }

    return Math.floor(days / 7);

}

function isArchiveReviewDue(player) {

    if (!player.active || player.archived) {
        return false;
    }

    if (!player.lastAttendanceDate) {
        return false;
    }

    return getDaysSinceDate(
        player.lastAttendanceDate
    ) >= 84;

}

/* =========================================================
   PLAYER FINDER
   ========================================================= */

function findPlayerByID(playerID) {

    for (const ageGroup of ageGroups) {

        if (!players[ageGroup]) {
            continue;
        }

        const player =
            players[ageGroup].find(
                player =>
                    String(player.id) === String(playerID)
            );

        if (player) {
            return player;
        }

    }

    return null;

}

/* =========================================================
   LOAD SAVED DATA
   ========================================================= */

function loadSavedData() {

    try {

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "clubCheckInData"
                )
            );

        if (saved) {

            if (saved.players) {
                players = saved.players;
            }

            if (saved.sessions) {
                sessions = saved.sessions;
            }

            if (saved.dailyRegisters) {
                dailyRegisters =
                    saved.dailyRegisters;
            }

            if (saved.currentSeason) {
                currentSeason =
                    saved.currentSeason;
            }

            if (saved.coachPIN) {
                coachPIN =
                    saved.coachPIN;
            }

            if (saved.seniorPIN) {
                seniorPIN =
                    saved.seniorPIN;
            }

        }

        ageGroups.forEach(ageGroup => {

            if (!players[ageGroup]) {
                players[ageGroup] = [];
            }

            if (!sessions[ageGroup]) {
                sessions[ageGroup] = [];
            }

            players[ageGroup].forEach(player => {

                if (
                    typeof player.coachGmsSuggestion
                    !== "boolean"
                ) {

                    player.coachGmsSuggestion =
                        !!player.gms;

                }

                if (
                    typeof player.archived
                    !== "boolean"
                ) {

                    player.archived = false;

                }

                if (
                    typeof player.active
                    !== "boolean"
                ) {

                    player.active =
                        !player.archived;

                }

                if (
                    typeof player.lastAttendanceDate
                    === "undefined"
                ) {

                    player.lastAttendanceDate =
                        null;

                }

            });

        });

        backfillLastAttendanceDates();

    } catch (error) {

        console.log(
            "Saved data could not be loaded.",
            error
        );

    }

}

/* =========================================================
   BACKFILL ATTENDANCE
   ========================================================= */

function backfillLastAttendanceDates() {

    Object.keys(dailyRegisters)
        .forEach(dateKey => {

            const day =
                dailyRegisters[dateKey];

            if (!day) {
                return;
            }

            Object.keys(day)
                .forEach(ageGroup => {

                    const register =
                        day[ageGroup];

                    if (
                        !register ||
                        !register.attendance
                    ) {
                        return;
                    }

                    Object.keys(
                        register.attendance
                    ).forEach(playerID => {

                        if (
                            register.attendance[playerID]
                            !== true
                        ) {
                            return;
                        }

                        const player =
                            findPlayerByID(
                                playerID
                            );

                        if (!player) {
                            return;
                        }

                        if (
                            !player.lastAttendanceDate ||
                            dateKey >
                            player.lastAttendanceDate
                        ) {

                            player.lastAttendanceDate =
                                dateKey;

                        }

                    });

                });

        });

}

function saveData() {

    localStorage.setItem(
        "clubCheckInData",
        JSON.stringify({

            players:
                players,

            sessions:
                sessions,

            dailyRegisters:
                dailyRegisters,

            currentSeason:
                currentSeason,

            coachPIN:
                coachPIN,

            seniorPIN:
                seniorPIN

        })
    );

}

/* =========================================================
   ACTIVE PLAYERS
   ========================================================= */

function getActivePlayers(ageGroup) {

    if (!players[ageGroup]) {
        return [];
    }

    return players[ageGroup]
        .filter(player =>
            player.active &&
            !player.archived
        );

}

function getAllActivePlayers() {

    let result = [];

    ageGroups.forEach(ageGroup => {

        getActivePlayers(ageGroup)
            .forEach(player => {

                result.push(player);

            });

    });

    return result;

}

/* =========================================================
   REGISTER HELPERS
   ========================================================= */

function closeExpiredRegisters() {

    const todayKey =
        getTodayKey();

    Object.keys(dailyRegisters)
        .forEach(dateKey => {

            if (dateKey >= todayKey) {
                return;
            }

            Object.keys(
                dailyRegisters[dateKey]
            ).forEach(ageGroup => {

                const register =
                    dailyRegisters[
                        dateKey
                    ][ageGroup];

                if (
                    register &&
                    !register.submitted
                ) {

                    submitDailyRegister(
                        dateKey,
                        ageGroup,
                        true
                    );

                }

            });

        });

}

function submitDailyRegister(
    dateKey,
    ageGroup,
    automatic = false
) {

    if (!dailyRegisters[dateKey]) {
        return;
    }

    const register =
        dailyRegisters[
            dateKey
        ][ageGroup];

    if (!register) {
        return;
    }

    /*
        Only prevent an automatic close
        from running more than once.

        Normal manual use does NOT get blocked.
    */

    if (
        register.submitted &&
        automatic
    ) {
        return;
    }

    const active =
        getActivePlayers(
            ageGroup
        );

    const attendance =
        register.attendance || {};

    const presentPlayers =
        active.filter(
            player =>
                attendance[player.id] === true
        );

    presentPlayers.forEach(
        player => {

            player.lastAttendanceDate =
                dateKey;

        }
    );

    const present =
        presentPlayers.length;

    if (!sessions[ageGroup]) {
        sessions[ageGroup] = [];
    }

    let existingSession =
        sessions[ageGroup].find(
            session =>
                session.dateKey === dateKey
        );

    if (existingSession) {

        existingSession.date =
            getDisplayDate(
                dateKey
            );

        existingSession.present =
            present;

        existingSession.total =
            active.length;

    } else {

        sessions[ageGroup].push({

            date:
                getDisplayDate(
                    dateKey
                ),

            dateKey:
                dateKey,

            present:
                present,

            total:
                active.length

        });

    }

    /*
        Record that the register has been
        processed, but do NOT use this as
        a lock for the coach.
    */

    register.submitted =
        automatic;

    register.closedAutomatically =
        automatic;

    saveData();

}

function getTodayRegister(ageGroup) {

    const todayKey =
        getTodayKey();

    if (
        dailyRegisters[todayKey] &&
        dailyRegisters[todayKey][ageGroup]
    ) {

        return dailyRegisters[
            todayKey
        ][ageGroup];

    }

    return null;

}

function createTodayRegister(ageGroup) {

    const todayKey =
        getTodayKey();

    if (!dailyRegisters[todayKey]) {
        dailyRegisters[todayKey] = {};
    }

    if (
        !dailyRegisters[todayKey][ageGroup]
    ) {

        const attendance = {};

        getActivePlayers(
            ageGroup
        ).forEach(player => {

            attendance[player.id] =
                false;

        });

        dailyRegisters[
            todayKey
        ][ageGroup] = {

            submitted:
                false,

            closedAutomatically:
                false,

            attendance:
                attendance

        };

        saveData();

    }

    return dailyRegisters[
        todayKey
    ][ageGroup];

}

function reopenTodayRegister() {

    selectedAgeGroups.forEach(
        ageGroup => {

            const register =
                getTodayRegister(
                    ageGroup
                );

            if (!register) {
                return;
            }

            /*
                Today's register is always editable.
            */

            register.submitted =
                false;

            register.closedAutomatically =
                false;

        }
    );

    saveData();

    showRegister();

}

/* =========================================================
   GENERAL HELPERS
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function getNextAgeGroup(ageGroup) {

    const index =
        ageGroups.indexOf(ageGroup);

    if (index < 0) {
        return null;
    }

    if (
        index >= ageGroups.length - 1
    ) {
        return null;
    }

    return ageGroups[
        index + 1
    ];

}

function getNextSeason(season) {

    const parts =
        season.split("/");

    const start =
        parseInt(parts[0], 10);

    const end =
        parseInt(parts[1], 10);

    return (
        start + 1
    ) + "/" + (
        String(end + 1).slice(-2)
    );

}

function ageGroupNeedsGMSConfirmation(
    ageGroup
) {

    return getActivePlayers(
        ageGroup
    ).some(
        player =>
            !player.gms
    );

}

function setAttendance(
    playerID,
    present
) {

    let foundAgeGroup = null;

    const player =
        findPlayerByID(
            playerID
        );

    if (!player) {
        return;
    }

    foundAgeGroup =
        player.ageGroup;

    const register =
        getTodayRegister(
            foundAgeGroup
        );

    if (
        !register ||
        register.submitted
    ) {
        return;
    }

    register.attendance[
        playerID
    ] =
        present;

    if (present) {

        player.lastAttendanceDate =
            getTodayKey();

    }

    saveData();

    showRegister();

function saveSession() {

        selectedAgeGroups.length
        ? selectedAgeGroups
        : [currentAgeGroup];

    groups.forEach(
        ageGroup => {

                getTodayRegister(
                    ageGroup
                );

            if (
                register &&
                !register.submitted
            ) {

                submitDailyRegister(
                    getTodayKey(),
                    ageGroup,
                    false
                );

            }

        }
    );

    showCoachDashboard();

}

function coachAddPlayer() {

    const name =
        document.getElementById(
            "coachPlayerName"
        ).value.trim();

    if (!name) {

        alert(
            "Please enter a player name."
        );

        return;

    }

    const groups =
        selectedAgeGroups.length
        ? selectedAgeGroups
        : [currentAgeGroup];

    if (!groups.length) {

        alert(
            "Please select an age group first."
        );

        return;

    }

    let targetAgeGroup =
        groups[0];

    /*
        If multiple age groups are selected,
        use the age group selected in the dropdown.
    */

    if (groups.length > 1) {

        const select =
            document.getElementById(
                "targetAgeGroup"
            );

        if (!select || !select.value) {

            alert(
                "Please select an age group."
            );

            return;

        }

        targetAgeGroup =
            select.value;

    }

    /*
        Find players with the same name
        across all age groups.
    */

    const matchingPlayers = [];

    ageGroups.forEach(
        ageGroup => {

            (players[ageGroup] || [])
                .forEach(
                    player => {

                        if (
                            player.name &&
                            player.name
                                .trim()
                                .toLowerCase() ===
                            name.toLowerCase()
                        ) {

                            matchingPlayers.push({

                                player:
                                    player,

                                ageGroup:
                                    ageGroup

                            });

                        }

                    }
                );

        }
    );

    /*
        Check for an archived match first.
    */

    const archivedMatch =
        matchingPlayers.find(
            match =>
                match.player.archived === true
        );

    if (archivedMatch) {

        const restore =
            confirm(
                name +
                " is already recorded as an archived player " +
                "in " +
                archivedMatch.ageGroup +
                ".\n\n" +
                "Would you like to restore their existing record " +
                "to " +
                targetAgeGroup +
                "?"
            );

        if (restore) {

            restoreArchivedPlayer(
                archivedMatch.player.id
            );

        }

        return;

    }

    /*
        Check for an active match.
    */

    const activeMatch =
        matchingPlayers.find(
            match =>
                match.player.active === true &&
                match.player.archived !== true
        );

    if (activeMatch) {

        /*
            Same age group.
        */

        if (
            activeMatch.ageGroup ===
            targetAgeGroup
        ) {

            alert(
                name +
                " is already registered in " +
                targetAgeGroup +
                ".\n\n" +
                "A duplicate player has not been created."
            );

            return;

        }

        /*
            Same name but different age group.
            Allow the coach to confirm that this
            is genuinely a different player.
        */

        const differentPlayer =
            confirm(
                name +
                " is already registered in " +
                activeMatch.ageGroup +
                ".\n\n" +
                "You are trying to add them to " +
                targetAgeGroup +
                ".\n\n" +
                "If this is the same player, cancel.\n\n" +
                "If this is a different player with the same name, " +
                "press OK to continue."
            );

        if (!differentPlayer) {

            return;

        }

    }

    /*
        Check that today's register is open.
    */

    const register =
        getTodayRegister(
            targetAgeGroup
        );

    if (
        !register ||
        register.submitted
    ) {

        alert(
            "Today's register is not open for "
            + targetAgeGroup
            + "."
        );

        return;

    }

    /*
        Create the new player.
    */

    const newPlayer =
        addPlayerToAgeGroup(
            targetAgeGroup,
            name,
            false
        );

    /*
        A player added during today's register
        is automatically marked as attending.
    */

    register.attendance[
        newPlayer.id
    ] = true;

    newPlayer.lastAttendanceDate =
        getTodayKey();

    saveData();

    showRegister();

}


function searchArchivedPlayers() {

    const input =
        document.getElementById(
            "coachPlayerName"
        );

    const results =
        document.getElementById(
            "archiveSearchResults"
        );

    if (!input || !results) {
        return;
    }

    const search =
        input.value.trim().toLowerCase();

    if (!search) {

        results.innerHTML = "";

        return;

    }

    const matches = [];

    /*
        Search all age groups for archived players.
    */

    ageGroups.forEach(
        ageGroup => {

            (players[ageGroup] || [])
                .forEach(
                    player => {

                        if (
                            player.archived &&
                            player.name &&
                            player.name
                                .toLowerCase()
                                .includes(search)
                        ) {

                            matches.push({

                                player:
                                    player,

                                previousAgeGroup:
                                    ageGroup

                            });

                        }

                    }
                );

        }
    );

    /*
        No archived matches found.
    */

    if (matches.length === 0) {

        results.innerHTML = `

            <div class="info-box">

                No archived player matches
                <strong>
                    "${escapeHTML(
                        input.value.trim()
                    )}"
                </strong>.

                <br><br>

                You can add them as a new player if
                this is a new registration.

            </div>

        `;

        return;

    }

    /*
        Display archived matches.
    */

    results.innerHTML = `

        <div class="
            info-box
            success-box
        ">

            Archived player found.

            <br>

            Select the player below to restore
            their existing record.

        </div>

        ${
            matches.map(
                match => `

                    <div class="list-row">

                        <div class="list-title">

                            ${escapeHTML(
                                match.player.name
                            )}

                        </div>

                        <div class="list-sub">

                            Previously:
                            ${escapeHTML(
                                match.previousAgeGroup
                            )}

                            ${
                                match.player.lastAttendanceDate
                                ? `
                                    · Last attended:
                                    ${
                                        getDisplayDate(
                                            match.player.lastAttendanceDate
                                        )
                                    }
                                `
                                : ""
                            }

                        </div>

                        <br>

                        <button
                            class="blue-button"
                            onclick="
                                restoreArchivedPlayer(
                                    ${match.player.id}
                                )
                            ">

                            Restore Player

                        </button>

                    </div>

                `
            ).join("")
        }

    `;

}


function restoreArchivedPlayer(
    playerID
) {

    const player =
        findPlayerByID(
            playerID
        );

    if (!player) {
        return;
    }

    const groups =
        selectedAgeGroups.length
        ? selectedAgeGroups
        : [currentAgeGroup];

    if (!groups.length) {

        alert(
            "Please select an age group first."
        );

        return;

    }

    let targetAgeGroup =
        groups[0];

    /*
        If multiple age groups are selected,
        use the dropdown.
    */

    if (groups.length > 1) {

        const select =
            document.getElementById(
                "targetAgeGroup"
            );

        if (!select || !select.value) {

            alert(
                "Please select the age group to restore the player to."
            );

            return;

        }

        targetAgeGroup =
            select.value;

    }

    /*
        Make sure today's register is open.
    */

    const register =
        getTodayRegister(
            targetAgeGroup
        );

    if (
        !register ||
        register.submitted
    ) {

        alert(
            "Today's register is not open for "
            + targetAgeGroup
            + "."
        );

        return;

    }

    /*
        Confirm the restore.
    */

    const confirmed =
        confirm(
            "Restore "
            + player.name
            + " to "
            + targetAgeGroup
            + "?\n\n"
            + "Their historical attendance will be retained.\n"
            + "They will be marked as PRESENT today.\n"
            + "GMS will be reset and require Senior confirmation."
        );

    if (!confirmed) {
        return;
    }

    /*
        Remove the player from any existing
        age-group array.
    */

    ageGroups.forEach(
        ageGroup => {

            if (!players[ageGroup]) {
                return;
            }

            players[ageGroup] =
                players[ageGroup].filter(
                    item =>
                        item.id !== player.id
                );

        }
    );

    /*
        Update the player's current status.
    */

    player.ageGroup =
        targetAgeGroup;

    player.active =
        true;

    player.archived =
        false;

    player.gms =
        false;

    player.coachGmsSuggestion =
        false;

    /*
        Add the player to the new age group.
    */

    if (!players[targetAgeGroup]) {

        players[targetAgeGroup] = [];

    }

    players[targetAgeGroup].push(
        player
    );

    /*
        Restored during today's register:
        mark the player as present today.
    */

    register.attendance[
        player.id
    ] = true;

    player.lastAttendanceDate =
        getTodayKey();

    saveData();

    showRegister();

}

function archivePlayer(
    playerID,
    returnTo
) {

    const player =
        findPlayerByID(
            playerID
        );

    if (!player) {
        return;
    }

    const confirmed =
        confirm(
            "Archive "
            + player.name
            + "?\n\n"
            + "Their historical attendance will be retained.\n"
            + "They will disappear from active registers."
        );

    if (!confirmed) {
        return;
    }

    player.active =
        false;

    player.archived =
        true;

    player.coachGmsSuggestion =
        false;

    saveData();

    if (
        returnTo ===
        "playerManagement"
    ) {

        showPlayerManagement(
            player.ageGroup
        );

    } else {

        showArchiveReview();

    }

}

) {

        document.getElementById(

    if (!name) {

        alert(

    addPlayerToAgeGroup(

        name,

    showPlayerManagement(
        ageGroup

function addPlayerToAgeGroup(
    ageGroup,
    name,
    gms
) {

    if (!players[ageGroup]) {
        players[ageGroup] = [];
    }

    const id =
        Date.now()
        + Math.floor(
            Math.random() * 1000
        );

    const newPlayer = {

        id:
            id,

        name:
            name,

        ageGroup:
            ageGroup,

        gms:
            gms,

        coachGmsSuggestion:
            false,

        active:
            true,

        archived:
            false,

        lastAttendanceDate:
            null

    };

    players[ageGroup].push(
        newPlayer
    );

    saveData();

    return newPlayer;

}

                </strong>

function confirmNewSeason() {

    const nextSeason =
        getNextSeason(
            currentSeason
        );

    const confirmed =
        confirm(
            "Start season "
            + nextSeason
            + "?\n\n"
            + "All active players will move up one age group.\n\n"
            + "U18 players will leave the active register."
        );

    if (!confirmed) {
        return;
    }

    performNewSeason(
        nextSeason
    );

}

function performNewSeason(
    nextSeason
) {

    const newPlayers = {};

    ageGroups.forEach(
        ageGroup => {

            newPlayers[ageGroup] =
                [];

        }
    );

    ageGroups.forEach(
        ageGroup => {

        if (!players[ageGroup]) {
            players[ageGroup] = [];
        }

        const inactive =
            players[ageGroup]
                .filter(
                    player =>
                        !player.active
                );

        inactive.forEach(
            player => {

                newPlayers[ageGroup]
                    .push(player);

            }
        );

        const active =
            players[ageGroup]
                .filter(
                    player =>
                        player.active
                );

        active.forEach(
            player => {

            const next =
                getNextAgeGroup(
                    ageGroup
                );

            if (next) {

                player.ageGroup =
                    next;

                newPlayers[next]
                    .push(player);

            } else {

                player.active =
                    false;

                newPlayers[ageGroup]
                    .push(player);

            }

        });

    });

    players =
        newPlayers;

    currentSeason =
        nextSeason;

    saveData();

    showSeniorDashboard();

}

function showChangePIN(
    type
) {

    const title =
        type === "coach"
        ? "Change Coach PIN"
        : "Change Senior Member PIN";

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showPINManagement()">

                ← Back

            </button>

            <h2>
                ${title}
            </h2>

            <div class="form-group">

                <label class="title">
                    New PIN
                </label>

                <input
                    id="newPIN"
                    class="pin-input"
                    type="password"
                    inputmode="numeric"
                    maxlength="8">

            </div>

            <div class="form-group">

                <label class="title">
                    Confirm New PIN
                </label>

                <input
                    id="confirmPIN"
                    class="pin-input"
                    type="password"
                    inputmode="numeric"
                    maxlength="8">

            </div>

            <div
                id="changePINError"
                class="error">
            </div>

            <button
                class="green-button"
                onclick="
                    changePIN(
                        '${type}'
                    )
                ">

                Save New PIN

            </button>

    `);

}

function changePIN(
    type
) {

    const newPIN =
        document.getElementById(
            "newPIN"
        ).value;

    const confirmPIN =
        document.getElementById(
            "confirmPIN"
        ).value;

    const error =
        document.getElementById(
            "changePINError"
        );

    error.textContent = "";

    if (
        !newPIN ||
        !confirmPIN
    ) {

        error.textContent =
            "Please enter and confirm the new PIN.";

        return;

    }

    if (
        newPIN !== confirmPIN
    ) {

        error.textContent =
            "The PINs do not match.";

        return;

    }

    if (
        !/^\d+$/.test(newPIN)
    ) {

        error.textContent =
            "PIN must contain numbers only.";

        return;

    }

    if (
        newPIN.length < 4
    ) {

        error.textContent =
            "PIN must be at least 4 digits.";

        return;

    }

    if (type === "coach") {

        coachPIN =
            newPIN;

    } else {

        seniorPIN =
            newPIN;

    }

    saveData();

    showPINManagement();

}
