<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Check-In</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
        }

        .app {
            min-height: 100vh;
            max-width: 500px;
            margin: auto;
            background: #fff;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 25px;
            text-align: center;
        }

        .crest {
            width: 170px;
            height: 170px;
            margin-bottom: 25px;
        }

        .crest img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .club-name {
            margin-top: 8px;
            margin-bottom: 45px;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .button {
            width: 100%;
            max-width: 330px;
            padding: 18px;
            margin: 7px 0;
            border: 2px solid #000;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .coach {
            background: #000;
            color: #fff;
        }

        .senior {
            background: #fff;
            color: #000;
        }

        .button:hover {
            opacity: 0.8;
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: #777;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="crest">
            <img src="RHRFC.jpg" alt="Rushden & Higham RFC">
        </div>

        <h1>CLUB CHECK-IN</h1>

        <div class="club-name">
            Rushden &amp; Higham RFC
        </div>

        <button class="button coach">
            Coach
        </button>

        <button class="button senior">
            Senior Member
        </button>

        <div class="footer">
            Digital Club Attendance
        </div>

    </div>

</body>
</html>
