<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Club Check-In</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f3f3;
    color: #111;
}

body {
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

#app {
    min-height: 100vh;
}

/* =========================
   APP HEADER
   ========================= */

.app-header {
    background: #000;
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 20;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand img {
    width: 42px;
    height: 42px;
    object-fit: contain;
}

.brand-title {
    font-size: 17px;
    font-weight: 700;
}

.brand-season {
    font-size: 11px;
    color: #bbb;
    margin-top: 2px;
}

.header-button {
    background: #333;
    border: 0;
    color: #fff;
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 12px;
}

/* =========================
   MAIN
   ========================= */

.page {
    max-width: 850px;
    margin: 0 auto;
    padding: 15px;
}

.card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 2px 7px rgba(0,0,0,.07);
}

h1,
h2,
h3 {
    margin-top: 0;
}

h2 {
    font-size: 22px;
    margin-bottom: 6px;
}

.subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 18px;
}

.back-button {
    background: #e3e3e3;
    border: 0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 15px;
}

.primary-button {
    width: 100%;
    background: #000;
    color: #fff;
    border: 0;
    border-radius: 11px;
    padding: 16px;
    font-weight: 700;
    font-size: 16px;
}

.secondary-button {
    background: #ddd;
    color: #111;
    border: 0;
    border-radius: 9px;
    padding: 11px 14px;
    font-weight: 700;
}

.green-button {
    background: #198754;
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 11px 14px;
    font-weight: 700;
}

.red-button {
    background: #c82333;
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 10px 13px;
    font-weight: 700;
}

.blue-button {
    background: #0d6efd;
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 11px 14px;
    font-weight: 700;
}

.small-button {
    padding: 8px 11px;
    font-size: 12px;
}

/* =========================
   WELCOME
   ========================= */

.welcome {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 18px;
}

.welcome-card {
    width: 100%;
    max-width: 430px;
    text-align: center;
    background: #fff;
    border-radius: 18px;
    padding: 30px 22px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.welcome-logo {
    width: 135px;
    height: 135px;
    object-fit: contain;
    margin-bottom: 15px;
}

.welcome-title {
    font-size: 31px;
    font-weight: 800;
    margin-bottom: 5px;
}

.welcome-club {
    color: #666;
    margin-bottom: 28px;
}

.role-button {
    width: 100%;
    padding: 17px;
    margin-top: 10px;
    border: 0;
    border-radius: 11px;
    background: #000;
    color: #fff;
    font-weight: 700;
    font-size: 17px;
}

/* =========================
   PIN
   ========================= */

.pin-card {
    max-width: 420px;
    margin: 45px auto;
    text-align: center;
}

.pin-input {
    width: 100%;
    padding: 15px;
    text-align: center;
    font-size: 25px;
    letter-spacing: 7px;
    border: 1px solid #ccc;
    border-radius: 10px;
    margin: 15px 0;
}

.error {
    min-height: 22px;
    color: #c82333;
    font-weight: 700;
    margin-bottom: 8px;
}

/* =========================
   AGE GROUPS
   ========================= */

.age-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.age-button {
    background: #000;
    color: #fff;
    border: 0;
    border-radius: 11px;
    padding: 19px 8px;
    font-size: 18px;
    font-weight: 700;
}

/* =========================
   DASHBOARD
   ========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin: 15px 0;
}

.stat {
    background: #f1f1f1;
    border-radius: 10px;
    padding: 13px 7px;
    text-align: center;
}

.stat-number {
    font-size: 25px;
    font-weight: 800;
}

.stat-label {
    color: #666;
    font-size: 11px;
    margin-top: 3px;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.menu-button {
    min-height: 82px;
    border: 0;
    border-radius: 12px;
    background: #000;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 12px;
}

.menu-button.blue {
    background: #0d6efd;
}

/* =========================
   PLAYER ROW
   ========================= */

.player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid #e0e0e0;
}

.player-row:last-child {
    border-bottom: 0;
}

.player-name {
    font-weight: 700;
}

.player-info {
    flex: 1;
}

.player-small {
    color: #777;
    font-size: 12px;
    margin-top: 3px;
}

.row-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* =========================
   SLIDE TOGGLES
   ========================= */

.toggle {
    position: relative;
    display: inline-flex;
    width: 108px;
    height: 38px;
    border-radius: 30px;
    cursor: pointer;
    overflow: hidden;
    flex-shrink: 0;
}

.toggle input {
    display: none;
}

.toggle-knob {
    position: absolute;
    top: 4px;
    width: 30px;
    height: 30px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
    transition: left .18s ease;
    z-index: 2;
}

.toggle-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    z-index: 3;
}

.toggle.present,
.toggle.confirmed {
    background: #198754;
}

.toggle.absent,
.toggle.not-confirmed {
    background: #c82333;
}

.toggle.present .toggle-knob,
.toggle.confirmed .toggle-knob {
    left: 74px;
}

.toggle.absent .toggle-knob,
.toggle.not-confirmed .toggle-knob {
    left: 4px;
}

.toggle.present .toggle-label,
.toggle.confirmed .toggle-label {
    justify-content: flex-start;
    padding-left: 10px;
}

.toggle.absent .toggle-label,
.toggle.not-confirmed .toggle-label {
    justify-content: flex-end;
    padding-right: 9px;
}

/* =========================
   FORMS
   ========================= */

.form-group {
    margin-bottom: 15px;
}

.form-group label.title {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
}

.text-input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
}

/* =========================
   INFORMATION BOXES
   ========================= */

.info-box {
    padding: 13px;
    border-radius: 9px;
    margin-bottom: 15px;
    background: #eee;
    font-size: 14px;
}

.warning-box {
    background: #fff3cd;
    color: #664d03;
    border: 1px solid #ffe69c;
}

.danger-box {
    background: #f8d7da;
    color: #842029;
    border: 1px solid #f1aeb5;
}

.success-box {
    background: #d1e7dd;
    color: #0f5132;
    border: 1px solid #a3cfbb;
}

/* =========================
   LISTS
   ========================= */

.list-row {
    padding: 13px 0;
    border-bottom: 1px solid #ddd;
}

.list-row:last-child {
    border-bottom: 0;
}

.list-title {
    font-weight: 700;
}

.list-sub {
    color: #666;
    font-size: 13px;
    margin-top: 3px;
}

.promotion-row {
    display: flex;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid #ddd;
}

.promotion-row:last-child {
    border-bottom: 0;
}

.empty {
    text-align: center;
    color: #777;
    padding: 25px 10px;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 520px) {

    .page {
        padding: 10px;
    }

    .card {
        border-radius: 12px;
        padding: 15px;
    }

    .age-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .age-button {
        padding: 17px 5px;
        font-size: 17px;
    }

    .menu-grid {
        grid-template-columns: 1fr 1fr;
    }

    .menu-button {
        min-height: 75px;
        font-size: 14px;
    }

    .player-row {
        align-items: flex-start;
        flex-direction: column;
    }

    .row-actions {
        width: 100%;
        justify-content: space-between;
    }
}

@media (max-width: 360px) {

    .age-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: 1fr 1fr 1fr;
    }

    .stat-number {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   CLUB CHECK-IN
   ========================================================= */

const ageGroups = [
    "U7",
    "U8",
    "U9",
    "U10",
    "U11",
    "U12",
    "U13",
    "U14",
    "U15",
    "U16",
    "U17",
    "U18"
];

/* =========================================================
   ACCESS
   ========================================================= */

let coachPIN = "1234";
let seniorPIN = "9999";

/* =========================================================
   SEASON
   ========================================================= */

let currentSeason = "2026/27";

/* =========================================================
   CURRENT SESSION
   ========================================================= */

let currentRole = null;
let currentAgeGroup = null;
let todayAttendance = {};

/* =========================================================
   PLAYERS
   ========================================================= */

let players = {

    U7: [],

    U8: [
        {
            id: 1,
            name: "Player One",
            ageGroup: "U8",
            gms: true,
            active: true
        },
        {
            id: 2,
            name: "Player Two",
            ageGroup: "U8",
            gms: true,
            active: true
        },
        {
            id: 3,
            name: "Player Three",
            ageGroup: "U8",
            gms: false,
            active: true
        },
        {
            id: 4,
            name: "Player Four",
            ageGroup: "U8",
            gms: false,
            active: true
        }
    ],

    U9: [],
    U10: [],
    U11: [],
    U12: [],
    U13: [],
    U14: [],
    U15: [],
    U16: [],
    U17: [],
    U18: []
};

/* =========================================================
   SESSIONS
   ========================================================= */

let sessions = {

    U8: [
        {
            date: "28/09/2026",
            present: 3,
            total: 4
        }
    ]

};

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function getActivePlayers(ageGroup) {

    if (!players[ageGroup]) {
        return [];
    }

    return players[ageGroup]
        .filter(player => player.active);

}

function getAllActivePlayers() {

    let result = [];

    ageGroups.forEach(ageGroup => {

        if (!players[ageGroup]) {
            return;
        }

        players[ageGroup].forEach(player => {

            if (player.active) {
                result.push(player);
            }

        });

    });

    return result;

}

function getNextAgeGroup(ageGroup) {

    const index =
        ageGroups.indexOf(ageGroup);

    if (index < 0) {
        return null;
    }

    if (index >= ageGroups.length - 1) {
        return null;
    }

    return ageGroups[index + 1];

}

function getNextSeason(season) {

    const parts = season.split("/");

    const start =
        parseInt(parts[0], 10);

    const end =
        parseInt(parts[1], 10);

    return (
        start + 1
    ) + "/" + (
        String(end + 1).slice(-2)
    );

}

/* =========================================================
   SHELL
   ========================================================= */

function renderShell(content, showHome = true) {

    document.getElementById("app").innerHTML = `

        <div class="app-header">

            <div class="brand">

                <img src="RHRFC.jpg"
                     alt="RHRFC">

                <div>

                    <div class="brand-title">
                        CLUB CHECK-IN
                    </div>

                    <div class="brand-season">
                        Season ${currentSeason}
                    </div>

                </div>

            </div>

            ${
                showHome
                ? `
                    <button
                        class="header-button"
                        onclick="showWelcome()">
                        Home
                    </button>
                `
                : ""
            }

        </div>

        <main class="page">
            ${content}
        </main>

    `;

}

/* =========================================================
   WELCOME
   ========================================================= */

function showWelcome() {

    currentRole = null;
    currentAgeGroup = null;

    document.getElementById("app").innerHTML = `

        <div class="welcome">

            <div class="welcome-card">

                <img
                    src="RHRFC.jpg"
                    class="welcome-logo"
                    alt="Rushden & Higham RFC">

                <div class="welcome-title">
                    CLUB CHECK-IN
                </div>

                <div class="welcome-club">
                    Rushden & Higham RFC
                </div>

                <button
                    class="role-button"
                    onclick="showPIN('coach')">
                    Coach
                </button>

                <button
                    class="role-button"
                    onclick="showPIN('senior')">
                    Senior Member
                </button>

            </div>

        </div>

    `;

}

/* =========================================================
   PIN
   ========================================================= */

function showPIN(role) {

    currentRole = role;

    const roleName =
        role === "coach"
        ? "Coach"
        : "Senior Member";

    renderShell(`

        <div class="card pin-card">

            <button
                class="back-button"
                onclick="showWelcome()">
                ← Back
            </button>

            <h2>${roleName} Access</h2>

            <div class="subtitle">
                Enter your PIN to continue.
            </div>

            <input
                id="pinInput"
                class="pin-input"
                type="password"
                inputmode="numeric"
                maxlength="8"
                autocomplete="off">

            <div
                id="pinError"
                class="error">
            </div>

            <button
                class="primary-button"
                onclick="checkPIN()">
                Continue
            </button>

        </div>

    `);

    document.getElementById("pinInput").focus();

}

function checkPIN() {

    const entered =
        document.getElementById("pinInput").value;

    if (
        currentRole === "coach" &&
        entered === coachPIN
    ) {

        showCoachAgeGroups();

        return;
    }

    if (
        currentRole === "senior" &&
        entered === seniorPIN
    ) {

        showSeniorDashboard();

        return;
    }

    document.getElementById("pinError").textContent =
        "Incorrect PIN.";

}

/* =========================================================
   COACH AGE GROUPS
   ========================================================= */

function showCoachAgeGroups() {

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showWelcome()">
                ← Back
            </button>

            <h2>Select Age Group</h2>

            <div class="subtitle">
                Select the team you are taking attendance for.
            </div>

            <div class="age-grid">

                ${
                    ageGroups.map(age => `

                        <button
                            class="age-button"
                            onclick="selectCoachAgeGroup('${age}')">
                            ${age}
                        </button>

                    `).join("")
                }

            </div>

        </div>

    `);

}

function selectCoachAgeGroup(ageGroup) {

    currentAgeGroup = ageGroup;

    showCoachDashboard();

}

/* =========================================================
   COACH DASHBOARD
   ========================================================= */

function showCoachDashboard() {

    const active =
        getActivePlayers(currentAgeGroup);

    const present =
        active.filter(player =>
            todayAttendance[player.id] === true
        ).length;

    const absent =
        active.length - present;

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showCoachAgeGroups()">
                ← Age Groups
            </button>

            <h2>${currentAgeGroup}</h2>

            <div class="subtitle">
                Coach Dashboard
            </div>

            <div class="stats">

                <div class="stat">
                    <div class="stat-number">
                        ${active.length}
                    </div>
                    <div class="stat-label">
                        Players
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-number">
                        ${present}
                    </div>
                    <div class="stat-label">
                        Present
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-number">
                        ${absent}
                    </div>
                    <div class="stat-label">
                        Absent
                    </div>
                </div>

            </div>

            <div class="menu-grid">

                <button
                    class="menu-button"
                    onclick="showRegister()">
                    Today's<br>Register
                </button>

                <button
                    class="menu-button"
                    onclick="showRoster()">
                    Roster
                </button>

                <button
                    class="menu-button"
                    onclick="showSessionHistory()">
                    Session<br>History
                </button>

                <button
                    class="menu-button"
                    onclick="showCoachAddPlayer()">
                    Add<br>Player
                </button>

            </div>

        </div>

    `);

}

/* =========================================================
   REGISTER
   ========================================================= */

function showRegister() {

    const active =
        getActivePlayers(currentAgeGroup);

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showCoachDashboard()">
                ← Back
            </button>

            <h2>Today's Register</h2>

            <div class="subtitle">
                ${currentAgeGroup}
            </div>

            ${
                active.length === 0

                ? `
                    <div class="empty">
                        No active players.
                    </div>
                `

                : active.map(player => {

                    const present =
                        todayAttendance[player.id] === true;

                    return `

                        <div class="player-row">

                            <div class="player-info">

                                <div class="player-name">
                                    ${escapeHTML(player.name)}
                                </div>

                            </div>

                            <label
                                class="toggle ${
                                    present
                                    ? "present"
                                    : "absent"
                                }">

                                <input
                                    type="checkbox"
                                    ${present ? "checked" : ""}
                                    onchange="
                                        setAttendance(
                                            ${player.id},
                                            this.checked
                                        )
                                    ">

                                <span class="toggle-knob"></span>

                                <span class="toggle-label">
                                    ${
                                        present
                                        ? "PRESENT"
                                        : "ABSENT"
                                    }
                                </span>

                            </label>

                        </div>

                    `;

                }).join("")
            }

            ${
                active.length
                ? `
                    <br>

                    <button
                        class="green-button"
                        onclick="saveSession()">
                        Save Session
                    </button>
                `
                : ""
            }

        </div>

    `);

}

function setAttendance(playerID, present) {

    todayAttendance[playerID] = present;

    showRegister();

}

function saveSession() {

    const active =
        getActivePlayers(currentAgeGroup);

    const present =
        active.filter(player =>
            todayAttendance[player.id] === true
        ).length;

    if (!sessions[currentAgeGroup]) {
        sessions[currentAgeGroup] = [];
    }

    const now = new Date();

    const date =
        String(now.getDate()).padStart(2, "0")
        + "/"
        + String(now.getMonth() + 1).padStart(2, "0")
        + "/"
        + now.getFullYear();

    sessions[currentAgeGroup].push({

        date: date,
        present: present,
        total: active.length

    });

    alert(
        "Session saved.\n\n"
        + present
        + " of "
        + active.length
        + " players present."
    );

    todayAttendance = {};

    showCoachDashboard();

}

/* =========================================================
   ROSTER
   ========================================================= */

function showRoster() {

    const active =
        getActivePlayers(currentAgeGroup);

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showCoachDashboard()">
                ← Back
            </button>

            <h2>Roster</h2>

            <div class="subtitle">
                ${currentAgeGroup}
            </div>

            ${
                active.length === 0

                ? `
                    <div class="empty">
                        No active players.
                    </div>
                `

                : active.map(player => `

                    <div class="player-row">

                        <div class="player-info">

                            <div class="player-name">
                                ${escapeHTML(player.name)}
                            </div>

                        </div>

                        <span>
                            ${player.gms
                            ? "GMS ✓"
                            : "GMS outstanding"}
                        </span>

                    </div>

                `).join("")
            }

        </div>

    `);

}

/* =========================================================
   COACH ADD PLAYER
   ========================================================= */

function showCoachAddPlayer() {

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showCoachDashboard()">
                ← Back
            </button>

            <h2>Add Player</h2>

            <div class="subtitle">
                Add a player to ${currentAgeGroup}.
            </div>

            <div class="form-group">

                <label class="title">
                    Player Name
                </label>

                <input
                    id="coachPlayerName"
                    class="text-input"
                    maxlength="100"
                    autocomplete="off">

            </div>

            <button
                class="green-button"
                onclick="coachAddPlayer()">
                Add Player
            </button>

        </div>

    `);

    document.getElementById("coachPlayerName").focus();

}

/* =========================================================
   PLAYER MANAGEMENT
   ========================================================= */

function showPlayerManagement(selectedAge = null) {

    if (selectedAge) {
        currentAgeGroup = selectedAge;
    }

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showSeniorDashboard()">
                ← Back
            </button>

            <h2>Player Management</h2>

            <div class="subtitle">
                Add, remove and manage GMS status.
            </div>

            <div class="age-grid">

                ${
                    ageGroups.map(age => `

                        <button
                            class="age-button"
                            onclick="showPlayerManagement('${age}')">
                            ${age}
                        </button>

                    `).join("")
                }

            </div>

        </div>

        ${
            currentAgeGroup
            ? renderPlayerManagementList(currentAgeGroup)
            : ""
        }

    `);

}

function renderPlayerManagementList(ageGroup) {

    const active =
        getActivePlayers(ageGroup);

    return `

        <div class="card">

            <h3>${ageGroup}</h3>

            ${
                active.length === 0

                ? `
                    <div class="empty">
                        No active players.
                    </div>
                `

                : active.map(player => `

                    <div class="player-row">

                        <div class="player-info">

                            <div class="player-name">
                                ${escapeHTML(player.name)}
                            </div>

                            <div class="player-small">
                                GMS status
                            </div>

                        </div>

                        <div class="row-actions">

                            <label
                                class="toggle ${
                                    player.gms
                                    ? "confirmed"
                                    : "not-confirmed"
                                }">

                                <input
                                    type="checkbox"
                                    ${player.gms ? "checked" : ""}
                                    onchange="
                                        setGMS(
                                            ${player.id},
                                            this.checked
                                        )
                                    ">

                                <span class="toggle-knob"></span>

                                <span class="toggle-label">
                                    ${
                                        player.gms
                                        ? "CONFIRMED"
                                        : "NOT CONF."
                                    }
                                </span>

                            </label>

                            <button
                                class="red-button small-button"
                                onclick="
                                    removePlayer(
                                        ${player.id}
                                    )
                                ">
                                Remove
                            </button>

                        </div>

                    </div>

                `).join("")
            }

            <br>

            <button
                class="green-button"
                onclick="
                    showSeniorAddPlayer('${ageGroup}')
                ">
                Add Player
            </button>

        </div>

    `;

}

function setGMS(playerID, confirmed) {

    for (const ageGroup of ageGroups) {

        const player =
            players[ageGroup]
                .find(player =>
                    player.id === playerID
                );

        if (player) {

            player.gms = confirmed;

            break;
        }

    }

    showPlayerManagement(currentAgeGroup);

}

/* =========================================================
   REMOVE PLAYER
   ========================================================= */

function removePlayer(playerID) {

    let playerFound = null;

    for (const ageGroup of ageGroups) {

        const player =
            players[ageGroup]
                .find(player =>
                    player.id === playerID
                );

        if (player) {

            playerFound = player;

            break;
        }

    }

    if (!playerFound) {
        return;
    }

    const confirmed =
        confirm(
            "Remove "
            + playerFound.name
            + " from the active register?\n\n"
            + "Their historical attendance will be retained."
        );

    if (!confirmed) {
        return;
    }

    playerFound.active = false;

    alert(
        playerFound.name
        + " has been removed."
    );

    showPlayerManagement(currentAgeGroup);

}

/* =========================================================
   SENIOR ADD PLAYER
   ========================================================= */

function showSeniorAddPlayer(ageGroup) {

    currentAgeGroup = ageGroup;

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="
                    showPlayerManagement('${ageGroup}')
                ">
                ← Back
            </button>

            <h2>Add Player</h2>

            <div class="subtitle">
                ${ageGroup}
            </div>

            <div class="form-group">

                <label class="title">
                    Player Name

                    id="seniorPlayerName"
                    class="text-input"
                    maxlength="100"
                    autocomplete="off">

            </div>

            <div class="form-group">

                <label class="title">
                    GMS Status
                </label>

                <label
                    id="newGMSToggle"
                    class="toggle not-confirmed">

                    <input
                        id="newGMS"
                        type="checkbox"
                        onchange="
                            updateNewGMSToggle()
                        ">

                    <span class="toggle-label">
                        NOT CONF.
                    </span>

                </label>

            <button
                class="green-button"

                Add Player
            </button>

    `);

    document.getElementById(
        "seniorPlayerName"
    ).focus();

}

function updateNewGMSToggle() {

    const input =
        document.getElementById("newGMS");

    const toggle =
        document.getElementById("newGMSToggle");

    const label =
        toggle.querySelector(".toggle-label");

    if (input.checked) {

        toggle.classList.remove(
            "not-confirmed"
        );

        toggle.classList.add(
            "confirmed"
        );

        label.textContent =
            "CONFIRMED";

    } else {

        toggle.classList.remove(
            "confirmed"
        );

        toggle.classList.add(
            "not-confirmed"
        );

        label.textContent =
            "NOT CONF.";

    }

}

function seniorAddPlayer(ageGroup) {

    const name =
        document.getElementById(
            "seniorPlayerName"
        ).value.trim();

    const gms =
        document.getElementById(
            "newGMS"
        ).checked;

    if (!name) {

        alert(
            "Please enter a player name."
        );

        return;
    }

    addPlayerToAgeGroup(
        ageGroup,
        name,
        gms
    );

    alert(
        name
        + " has been added to "
        + ageGroup
        + "."
    );

    showPlayerManagement(ageGroup);

}

function addPlayerToAgeGroup(
    ageGroup,
    name,
    gms
) {

    if (!players[ageGroup]) {
        players[ageGroup] = [];
    }

    const id =
        Date.now()
        + Math.floor(
            Math.random() * 1000
        );

    players[ageGroup].push({

        id: id,
        name: name,
        ageGroup: ageGroup,
        gms: gms,
        active: true

    });

}

/* =========================================================
   NEW SEASON
   ========================================================= */

function showNewSeason() {

    const nextSeason =
        getNextSeason(currentSeason);

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showSeniorDashboard()">
                ← Back
            </button>

            <h2>New Season</h2>

            <div class="subtitle">
                Move active players up one age group.
            </div>

            <div class="info-box warning-box">

                <strong>
                    Current season:
                </strong>

                ${currentSeason}

                <br><br>

                <strong>
                    New season:
                </strong>

                ${nextSeason}

            </div>

            <h3>Promotion Preview</h3>

            ${
                ageGroups
                    .slice(0, -1)
                    .map(ageGroup => {

                        const next =
                            getNextAgeGroup(
                                ageGroup
                            );

                        const count =
                            getActivePlayers(
                                ageGroup
                            ).length;

                        return `

                            <div
                                class="promotion-row">

                                <span>
                                    ${ageGroup}
                                    →
                                    ${next}
                                </span>

                                <strong>
                                    ${count}
                                </strong>

                            </div>

                        `;

                    })
                    .join("")
            }

            <div class="promotion-row">

                <span>
                    U18 → Leaving Active Register
                </span>

                <strong>
                    ${
                        getActivePlayers(
                            "U18"
                        ).length
                    }
                </strong>

            </div>

            <br>

            <div class="info-box danger-box">

                <strong>
                    Check the numbers before confirming.
                </strong>

                <br><br>

                This moves every active player up
                one age group.

            </div>

            <button
                class="blue-button"
                onclick="confirmNewSeason()">
                Confirm New Season
            </button>

        </div>

    `);

}

function confirmNewSeason() {

    const nextSeason =
        getNextSeason(currentSeason);

    const confirmed =
        confirm(
            "Start season "
            + nextSeason
            + "?\n\n"
            + "All active players will move up one age group.\n\n"
            + "U18 players will leave the active register."
        );

    if (!confirmed) {
        return;
    }

    performNewSeason(nextSeason);

}

function performNewSeason(nextSeason) {

    const newPlayers = {};

    ageGroups.forEach(ageGroup => {

        newPlayers[ageGroup] = [];

    });

    ageGroups.forEach(ageGroup => {

        const inactive =
            players[ageGroup]
                .filter(player =>
                    !player.active
                );

        inactive.forEach(player => {

            newPlayers[ageGroup]
                .push(player);

        });

        const active =
            players[ageGroup]
                .filter(player =>
                    player.active
                );

        active.forEach(player => {

            const next =
                getNextAgeGroup(
                    ageGroup
                );

            if (next) {

                player.ageGroup =
                    next;

                newPlayers[next]
                    .push(player);

            } else {

                player.active =
                    false;

                newPlayers[ageGroup]
                    .push(player);

            }

        });

    });

    players =
        newPlayers;

    currentSeason =
        nextSeason;

    todayAttendance = {};

    alert(
        "New season "
        + currentSeason
        + " has started."
    );

    showSeniorDashboard();

}

function showPINManagement() {

    renderShell(`

                </div>

                <br>

                <button

                    onclick="
                        showChangePIN('coach')

                    Change Coach PIN
                </button>

            </div>

            <div class="list-row">

                <div class="list-title">
                    Senior Member PIN
                </div>

                <div class="list-sub">

                </div>

function showChangePIN(type) {

    const title =
        type === "coach"
        ? "Change Coach PIN"
        : "Change Senior Member PIN";

    renderShell(`

        <div class="card">

            <button
                class="back-button"
                onclick="showPINManagement()">
                ← Back
            </button>

            <h2>${title}</h2>

            <div class="form-group">

                <label class="title">
                    New PIN
                </label>

                <input
                    id="newPIN"
                    class="pin-input"
                    type="password"
                    inputmode="numeric"
                    maxlength="8">

            </div>

            <div class="form-group">

                <label class="title">
                    Confirm New PIN
                </label>

                <input
                    id="confirmPIN"
                    class="pin-input"
                    type="password"
                    inputmode="numeric"
                    maxlength="8">

            </div>

            <div
                id="changePINError"
                class="error">
            </div>

            <button
                class="green-button"
                onclick="
                    changePIN('${type}')
                ">
                Save New PIN
            </button>

        </div>

    `);

}

function changePIN(type) {

    const newPIN =
        document.getElementById(
            "newPIN"
        ).value;

    const confirmPIN =
        document.getElementById(
            "confirmPIN"
        ).value;

    const error =
        document.getElementById(
            "changePINError"
        );

    error.textContent = "";

    if (!newPIN || !confirmPIN) {

        error.textContent =
            "Please enter and confirm the new PIN.";

        return;
    }

    if (newPIN !== confirmPIN) {

        error.textContent =
            "The PINs do not match.";

        return;
    }

    if (!/^\d+$/.test(newPIN)) {

        error.textContent =
            "PIN must contain numbers only.";

        return;
    }

    if (newPIN.length < 4) {

        error.textContent =
            "PIN must be at least 4 digits.";

        return;
    }

    if (type === "coach") {

        coachPIN =
            newPIN;

    } else {

        seniorPIN =
            newPIN;

    }

    alert(
        type === "coach"
        ? "Coach PIN changed."
        : "Senior Member PIN changed."
    );

    showPINManagement();

}
