<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Check-In</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 25px;
            text-align: center;
        }

        .crest {
            width: 130px;
            height: 130px;
            border: 3px solid #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 2px;
        }

        .club-name {
            margin-top: 8px;
            margin-bottom: 45px;
            font-size: 17px;
            color: #666;
        }

        .button {
            width: 100%;
            max-width: 320px;
            padding: 18px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .coach {
            background: #222;
            color: white;
        }

        .senior {
            background: #e9e9e9;
            color: #222;
        }

        .button:hover {
            opacity: 0.85;
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="crest">
            RH RFC<br>CREST
        </div>

        <h1>CLUB CHECK-IN</h1>

        <div class="club-name">
            Rushden &amp; Higham RFC
        </div>

        <button class="button coach">
            Coach
        </button>

        <button class="button senior">
            Senior Member
        </button>

        <div class="footer">
            Digital Club Attendance
        </div>

    </div>

</body>
</html>
