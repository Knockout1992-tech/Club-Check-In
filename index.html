<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Check-In</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f2f2;
    color: #111;
}

header {
    background: #000;
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-left img {
    width: 48px;
    height: 48px;
    object-fit: contain;
}

.header-title {
    font-size: 20px;
    font-weight: bold;
}

.header-season {
    font-size: 13px;
    color: #ccc;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h1, h2, h3 {
    margin-top: 0;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

.btn-black {
    background: #000;
    color: #fff;
}

.btn-grey {
    background: #ddd;
    color: #111;
}

.btn-green {
    background: #198754;
    color: #fff;
}

.btn-red {
    background: #c82333;
    color: #fff;
}

.btn-blue {
    background: #0d6efd;
    color: #fff;
}

.btn-small {
    padding: 8px 12px;
    font-size: 13px;
}

.welcome {
    text-align: center;
    padding: 35px 20px;
}

.welcome img {
    width: 150px;
    max-width: 60%;
    margin-bottom: 15px;
}

.welcome h1 {
    font-size: 34px;
    margin-bottom: 5px;
}

.welcome p {
    color: #555;
    margin-bottom: 28px;
}

.role-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    max-width: 500px;
    margin: auto;
}

.role-buttons button {
    padding: 20px;
    font-size: 18px;
}

.pin-box {
    max-width: 420px;
    margin: 40px auto;
    text-align: center;
}

.pin-input {
    width: 100%;
    padding: 15px;
    font-size: 24px;
    text-align: center;
    letter-spacing: 8px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin: 15px 0;
}

.error {
    color: #c82333;
    font-weight: bold;
    min-height: 22px;
}

.age-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.age-grid button {
    padding: 20px 10px;
    font-size: 18px;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.dashboard-grid button {
    min-height: 85px;
    font-size: 16px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
}

.stat {
    background: #f7f7f7;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
}

.stat-label {
    font-size: 13px;
    color: #666;
    margin-top: 4px;
}

.player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid #ddd;
}

.player-row:last-child {
    border-bottom: none;
}

.player-name {
    font-weight: bold;
}

.player-sub {
    font-size: 12px;
    color: #777;
    margin-top: 3px;
}

.actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.empty {
    color: #777;
    text-align: center;
    padding: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

.back {
    margin-bottom: 15px;
}

.session-row {
    padding: 13px 0;
    border-bottom: 1px solid #ddd;
}

.session-row:last-child {
    border-bottom: none;
}

.session-date {
    font-weight: bold;
}

.session-summary {
    color: #666;
    font-size: 13px;
    margin-top: 3px;
}

/* TOGGLE */

.toggle {
    position: relative;
    display: inline-flex;
    align-items: center;
    width: 108px;
    height: 38px;
    border-radius: 30px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s ease;
    flex-shrink: 0;
}

.toggle input {
    display: none;
}

.toggle-track {
    position: absolute;
    inset: 0;
    border-radius: 30px;
}

.toggle-knob {
    position: absolute;
    top: 4px;
    width: 30px;
    height: 30px;
    background: white;
    border-radius: 50%;
    transition: left 0.2s ease;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    z-index: 2;
}

.toggle-label {
    position: relative;
    z-index: 3;
    width: 100%;
    font-size: 12px;
    font-weight: bold;
    color: white;
    display: flex;
    align-items: center;
    height: 100%;
}

.toggle.present,
.toggle.confirmed {
    background: #198754;
}

.toggle.absent,
.toggle.not-confirmed {
    background: #c82333;
}

.toggle.present .toggle-knob,
.toggle.confirmed .toggle-knob {
    left: 74px;
}

.toggle.absent .toggle-knob,
.toggle.not-confirmed .toggle-knob {
    left: 4px;
}

.toggle.present .toggle-label,
.toggle.confirmed .toggle-label {
    justify-content: flex-start;
    padding-left: 12px;
}

.toggle.absent .toggle-label,
.toggle.not-confirmed .toggle-label {
    justify-content: flex-end;
    padding-right: 10px;
}

.warning-box {
    background: #fff3cd;
    border: 1px solid #ffe69c;
    color: #664d03;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 15px;
}

.success-box {
    background: #d1e7dd;
    border: 1px solid #a3cfbb;
    color: #0f5132;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 15px;
}

.danger-box {
    background: #f8d7da;
    border: 1px solid #f1aeb5;
    color: #842029;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 15px;
}

.promotion-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
}

.promotion-row:last-child {
    border-bottom: none;
}

.age-badge {
    display: inline-block;
    background: #000;
    color: #fff;
    border-radius: 5px;
    padding: 4px 7px;
    font-size: 12px;
    font-weight: bold;
}

.inactive {
    opacity: 0.55;
}

@media (max-width: 700px) {
    .age-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr 1fr 1fr;
    }

    .player-row {
        align-items: flex-start;
        flex-direction: column;
    }

    .player-row .actions {
        width: 100%;
        justify-content: space-between;
    }

    .role-buttons {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 450px) {
    .age-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-left">
        <img src="RHRFC.jpg" alt="RHRFC">
        <div>
            <div class="header-title">CLUB CHECK-IN</div>
            <div class="header-season" id="headerSeason"></div>
        </div>
    </div>

    <button class="btn-grey btn-small" onclick="showWelcome()">Home</button>
</header>

<div class="container" id="app"></div>

<script>

/* =========================================================
   CLUB CHECK-IN
   Prototype V2
   ========================================================= */

const ageGroups = [
    "U7", "U8", "U9", "U10", "U11", "U12",
    "U13", "U14", "U15", "U16", "U17", "U18"
];

let coachPIN = "1234";
let seniorPIN = "9999";

let currentSeason = "2026/27";

let currentRole = null;
let currentAgeGroup = null;

let todayAttendance = {};

/* =========================================================
   PLAYER DATA
   ========================================================= */

let players = {

    U7: [],

    U8: [
        {
            id: 1,
            name: "Player One",
            ageGroup: "U8",
            gms: true,
            active: true
        },
        {
            id: 2,
            name: "Player Two",
            ageGroup: "U8",
            gms: true,
            active: true
        },
        {
            id: 3,
            name: "Player Three",
            ageGroup: "U8",
            gms: false,
            active: true
        },
        {
            id: 4,
            name: "Player Four",
            ageGroup: "U8",
            gms: false,
            active: true
        }
    ],

    U9: [],
    U10: [],
    U11: [],
    U12: [],
    U13: [],
    U14: [],
    U15: [],
    U16: [],
    U17: [],
    U18: []
};

/* =========================================================
   SESSION DATA
   ========================================================= */

let sessions = {

    U8: [
        {
            date: "28/09/2026",
            present: 3,
            total: 4
        }
    ]

};

/* =========================================================
   HELPERS
   ========================================================= */

function getActivePlayers(ageGroup) {

    if (!players[ageGroup]) {
        return [];
    }

    return players[ageGroup].filter(p => p.active);
}

function getAllActivePlayers() {

    let result = [];

    ageGroups.forEach(age => {

        if (players[age]) {

            players[age].forEach(player => {

                if (player.active) {
                    result.push(player);
                }

            });

        }

    });

    return result;
}

function getTotalActivePlayers() {
    return getAllActivePlayers().length;
}

function getTotalGMSConfirmed() {

    return getAllActivePlayers()
        .filter(p => p.gms)
        .length;
}

function getNextAgeGroup(ageGroup) {

    const index = ageGroups.indexOf(ageGroup);

    if (index === -1) {
        return null;
    }

    if (index === ageGroups.length - 1) {
        return null;
    }

    return ageGroups[index + 1];
}

function updateHeader() {

    document.getElementById("headerSeason").textContent =
        "Season " + currentSeason;
}

function showWelcome() {

    currentRole = null;
    currentAgeGroup = null;

    document.getElementById("app").innerHTML = `

        <div class="card welcome">

            <img src="RHRFC.jpg" alt="Rushden & Higham RFC">

            <h1>CLUB CHECK-IN</h1>

            <p>Rushden & Higham RFC</p>

            <div class="role-buttons">

                <button class="btn-black"
                        onclick="showPIN('coach')">
                    Coach
                </button>

                <button class="btn-black"
                        onclick="showPIN('senior')">
                    Senior Member
                </button>

            </div>

        </div>

    `;

    updateHeader();
}

function showPIN(role) {

    currentRole = role;

    const roleName =
        role === "coach"
        ? "Coach"
        : "Senior Member";

    document.getElementById("app").innerHTML = `

        <div class="card pin-box">

            <h2>${roleName} Access</h2>

            <p>Enter your PIN.</p>

            <input
                id="pinInput"
                class="pin-input"
                type="password"
                inputmode="numeric"
                maxlength="8"
                autocomplete="off"
            >

            <div id="pinError" class="error"></div>

            <button class="btn-black"
                    onclick="checkPIN()">
                Continue
            </button>

            <br><br>

            <button class="btn-grey"
                    onclick="showWelcome()">
                Back
            </button>

        </div>

    `;

    document.getElementById("pinInput").focus();
}

function checkPIN() {

    const entered =
        document.getElementById("pinInput").value;

    if (
        currentRole === "coach" &&
        entered === coachPIN
    ) {

        showCoachAgeGroups();

        return;
    }

    if (
        currentRole === "senior" &&
        entered === seniorPIN
    ) {

        showSeniorDashboard();

        return;
    }

    document.getElementById("pinError").textContent =
        "Incorrect PIN.";
}

/* =========================================================
   AGE GROUP SELECTION
   ========================================================= */

function showCoachAgeGroups() {

    document.getElementById("app").innerHTML = `

        <div class="card">

            <div class="back">
                <button class="btn-grey btn-small"
                        onclick="showWelcome()">
                    ← Back
                </button>
            </div>

            <h2>Select Age Group</h2>

            <p>
                Choose the age group you are taking the register for.
            </p>

            <div class="age-grid">

                ${ageGroups.map(age => `

                    <button
                        class="btn-black"
                        onclick="selectCoachAgeGroup('${age}')">
                        ${age}
                    </button>

                `).join("")}

            </div>

        </div>

    `;

}

function selectCoachAgeGroup(ageGroup) {

    currentAgeGroup = ageGroup;

    showCoachDashboard();

}

/* =========================================================
   COACH DASHBOARD
   ========================================================= */

function showCoachDashboard() {

    const active =
        getActivePlayers(currentAgeGroup);

    const present =
        active.filter(p =>
            todayAttendance[p.id] === true
        ).length;

    const absent =
        active.length - present;

    document.getElementById("app").innerHTML = `

        <div class="card">

            <div class="back">
                <button class="btn-grey btn-small"
                        onclick="showCoachAgeGroups()">
                    ← Age Groups
                </button>
            </div>

            <h2>${currentAgeGroup} Dashboard</h2>

            <div class="stats">

                <div class="stat">
                    <div class="stat-number">
                        ${active.length}
                    </div>
                    <div class="stat-label">
                        Players
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-number">
                        ${present}
                    </div>
                    <div class="stat-label">
                        Present
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-number">
                        ${absent}
                    </div>
                    <div class="stat-label">
                        Absent
                    </div>
                </div>

            </div>

            <div class="dashboard-grid">

                <button class="btn-black"
                        onclick="showRegister()">
                    Today's Register
                </button>

                <button class="btn-black"
                        onclick="showRoster()">
                    Roster
                </button>

                <button class="btn-black"
                        onclick="showSessionHistory()">
                    Session History
                </button>

                <button class="btn-black"
                        onclick="showAddPlayer()">
                    Add Player
                </button>

            </div>

        </div>

    `;

}

/* =========================================================
   ATTENDANCE REGISTER
   ========================================================= */

function showRegister() {

    const active =
        getActivePlayers(currentAgeGroup);

    document.getElementById("app").innerHTML = `

        <div class="card">

            <button class="btn-grey btn-small back"
                    onclick="showCoachDashboard()">
                ← Back
            </button>

            <h2>${currentAgeGroup} - Today's Register</h2>

            ${
                active.length === 0
                ? `<div class="empty">
                       No active players.
                   </div>`
                : active.map(player => {

                    const present =
                        todayAttendance[player.id] === true;

                    return `

                        <div class="player-row">

                            <div>
                                <div class="player-name">
                                    ${escapeHTML(player.name)}
                                </div>
                            </div>

                            <label class="toggle ${
                                present
                                ? "present"
                                : "absent"
                            }">

                                <input
                                    type="checkbox"
                                    ${present ? "checked" : ""}
                                    onchange="setAttendance(
                                        ${player.id},
                                        this.checked
                                    )"
                                >

                                <span class="toggle-track"></span>

                                <span class="toggle-knob"></span>

                                <span class="toggle-label">
                                    ${
                                        present
                                        ? "PRESENT"
                                        : "ABSENT"
                                    }
                                </span>

                            </label>

                        </div>

                    `;

                }).join("")
            }

            ${
                active.length > 0
                ? `
                    <br>

                    <button class="btn-green"
                            onclick="saveSession()">
                        Save Session
                    </button>
                `
                : ""
            }

        </div>

    `;

}

function setAttendance(playerID, present) {

    todayAttendance[playerID] = present;

    showRegister();

}

/* =========================================================
   SAVE SESSION
   ========================================================= */

function saveSession() {

    const active =
        getActivePlayers(currentAgeGroup);

    const present =
        active.filter(p =>
            todayAttendance[p.id] === true
        ).length;

    if (!sessions[currentAgeGroup]) {
        sessions[currentAgeGroup] = [];
    }

    const now = new Date();

    const date =
        String(now.getDate()).padStart(2, "0")
        + "/"
        + String(now.getMonth() + 1).padStart(2, "0")
        + "/"
        + now.getFullYear();

    sessions[currentAgeGroup].push({

        date: date,
        present: present,
        total: active.length

    });

    alert(
        "Session saved.\n\n"
        + present
        + " of "
        + active.length
        + " players present."
    );

    todayAttendance = {};

    showCoachDashboard();

}

/* =========================================================
   ROSTER
   ========================================================= */

function showRoster() {

    const active =
        getActivePlayers(currentAgeGroup);

    document.getElementById("app").innerHTML = `

        <div class="card">

            <button class="btn-grey btn-small back"
                    onclick="showCoachDashboard()">
                ← Back
            </button>

            <h2>${currentAgeGroup} Roster</h2>

            ${
                active.length === 0
                ? `<div class="empty">
                       No active players.
                   </div>`
                : active.map(player => `

                    <div class="player-row">

                        <div>
                            <div class="player-name">
                                ${escapeHTML(player.name)}
                            </div>
                        </div>

                        <span class="age-badge">
                            ${player.ageGroup}
                        </span>

                    </div>

                `).join("")
            }

        </div>

    `;

}

/* =========================================================
   ADD PLAYER
   ========================================================= */

function showAddPlayer() {

    document.getElementById("app").innerHTML = `

        <div class="card">

            <button class="btn-grey btn-small back"
                    onclick="showCoachDashboard()">
                ← Back
            </button>

            <h2>Add Player</h2>

            <div class="form-group">

                <label>
                    Player Name
                </label>

                <input
                    id="newPlayerName"
                    type="text"
                    maxlength="100"
                    autocomplete="off"
                >

            </div>

            <button class="btn-green"
                    onclick="addPlayer()">
                Add Player
            </button>

        </div>

    `;

    document.getElementById("newPlayerName").focus();

}

function addPlayer() {

    const name =
        document.getElementById("newPlayerName")
        .value
        .trim();

    if (!name) {

        alert("Please enter a player name.");

        return;
    }

    if (!players[currentAgeGroup]) {
        players[currentAgeGroup] = [];
    }

    const id =
        Date.now()
        + Math.floor(Math.random() * 1000);

    players[currentAgeGroup].push({

        id: id,
        name: name,
        ageGroup: currentAgeGroup,
        gms: false,
        active: true

    });

    alert(
        name
        + " has been added to "
        + currentAgeGroup
        + "."
    );

    showCoachDashboard();

}

/* =========================================================
   SESSION HISTORY
   ========================================================= */

function showSessionHistory() {

    const history =
        sessions[currentAgeGroup] || [];

    document.getElementById("app").innerHTML = `

        <div class="card">

            <button class="btn-grey btn-small back"
                    onclick="showCoachDashboard()">
                ← Back
            </button>

            <h2>${currentAgeGroup} Session History</h2>

            ${
                history.length === 0
                ? `<div class="empty">
                       No sessions recorded yet.
                   </div>`
                : history.slice().reverse().map(session => `

                    <div class="session-row">

                        <div class="session-date">
                            ${session.date}
                        </div>

                        <div class="session-summary">
                            ${session.present}
                            of
                            ${session.total}
                            present
                        </div>

                    </div>

                `).join("")
            }

        </div>

    `;

}

/* =========================================================
   SENIOR DASHBOARD
   ========================================================= */

function showSeniorDashboard() {

    const active =
        getTotalActivePlayers();

    const gms =
        getTotalGMSConfirmed();

    document.getElementById("app").innerHTML = `

        <div class="card">

            <h2>Senior Dashboard</h2>

            <p>
                Season ${currentSeason}
            </p>

            <div class="stats">

                <div class="stat">
                    <div class="stat-number">
                        ${active}
                    </div>
                    <div class="stat-label">
                        Active Players
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-number">
                        ${gms}
                    </div>
                    <div class="stat-label">
                        GMS Confirmed
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-number">
                        ${active - gms}
                    </div>
                    <div class="stat-label">
                        GMS Outstanding
                    </div>
                </div>

            </div>

            <div class="dashboard-grid">

                <button class="btn-black"
                        onclick="showSeniorAgeGroups()">
                    View All Age Groups
                </button>

                <button class="btn-black"
                        onclick="showGMSVerification()">
                    GMS Verification
                </button>

                <button class="btn-black"
                        onclick="showPlayerManagement()">
                    Player Management
                </button>

                <button class="btn-blue"
                        onclick="showNewSeason()">
                    New Season
                </button>

                <button class="btn-black"
                        onclick="showChangeSeniorPIN()">
                    Change Senior PIN
                </button>

            </div>

        </div>

    `;

}

/* =========================================================
   SENIOR AGE GROUPS
   ========================================================= */

function showSeniorAgeGroups() {

    document.getElementById("app").innerHTML = `

        <div class="card">

            <button class="btn-grey btn-small back"
                    onclick="showSeniorDashboard()">
                ← Back
            </button>

            <h2>All Age Groups</h2>

            <div class="age-grid">

                ${ageGroups.map(age => `

                    <button
                        class="btn-black"
                        onclick="showSeniorAgeGroup('${age}')">
                        ${age}
                    </button>

                `).join("")}

            </div>

        </div>

    `;

}

/* =========================================================
   PLAYER MANAGEMENT
   ========================================================= */

function showPlayerManagement(selectedAge = null) {

    if (selectedAge) {
        currentAgeGroup = selectedAge;
    }

    document.getElementById("app").innerHTML = `

        <div class="card">

            <button class="btn-grey btn-small back"
                    onclick="showSeniorDashboard()">
                ← Back
            </button>

            <h2>Player Management</h2>

            <p>
                Manage players and confirm GMS status.
            </p>

            <div class="age-grid">

                ${ageGroups.map(age => `

                    <button
                        class="${
                            age === currentAgeGroup
                            ? "btn-blue"
                            : "btn-black"
                        }"
                        onclick="showPlayerManagement('${age}')">
                        ${age}
                    </button>

                `).join("")}

            </div>

        </div>

        ${
            currentAgeGroup
            ? renderPlayerManagementList(currentAgeGroup)
            : ""
        }

    `;

}

function renderPlayerManagementList(ageGroup) {

    const active =
        getActivePlayers(ageGroup);

    return `

        <div class="card">

            <h3>${ageGroup} Players</h3>

            ${
                active.length === 0
                ? `<div class="empty">
                       No active players.
                   </div>`
                : active.map(player => `

                    <div class="player-row">

                        <div>
                            <div class="player-name">
                                ${escapeHTML(player.name)}
                            </div>

                            <div class="player-sub">
                                GMS status
                            </div>
                        </div>

                        <div class="actions">

                            <label class="toggle ${
                                player.gms
                                ? "confirmed"
                                : "not-confirmed"
                            }">

                                <input
                                    type="checkbox"
                                    ${player.gms ? "checked" : ""}
                                    onchange="setGMS(
                                        ${player.id},
                                        this.checked
                                    )"
                                >

                                <span class="toggle-track"></span>

                                <span class="toggle-knob"></span>

                                <span class="toggle-label">
                                    ${
                                        player.gms
                                        ? "CONFIRMED"
                                        : "NOT CONF."
                                    }
                                </span>

                            </label>

                            <button
                                class="btn-red btn-small"
                                onclick="removePlayer(${player.id})">
                                Remove
                            </button>

                        </div>

                    </div>

                `).join("")
            }

            <br>

            <button
                class="btn-green"
                onclick="showSeniorAddPlayer('${ageGroup}')">
                Add Player
            </button>

        </div>

    `;

}

function setGMS(playerID, confirmed) {

    for (const age of ageGroups) {

        const player =
            players[age]
                .find(p => p.id === playerID);

        if (player) {

            player.gms = confirmed;

            break;
        }

    }

    showPlayerManagement(currentAgeGroup);

}

/* =========================================================
   REMOVE PLAYER
   ========================================================= */

function removePlayer(playerID) {

    let playerFound = null;

    for (const age of ageGroups) {

        const player =
            players[age]
                .find(p => p.id === playerID);

        if (player) {

            playerFound = player;

            break;
        }

    }

    if (!playerFound) {
        return;
    }

    const confirmRemove =
        confirm(
            "Remove "
            + playerFound.name
            + " from the active register?\n\n"
            + "Their historical attendance will be retained."
        );

    if (!confirmRemove) {
        return;
    }

    playerFound.active = false;

    alert(
        playerFound.name
        + " has been removed from the active register."
    );

    showPlayerManagement(currentAgeGroup);

}

/* =========================================================
   SENIOR ADD PLAYER
   ========================================================= */

function showSeniorAddPlayer(ageGroup) {

    currentAgeGroup = ageGroup;

    document.getElementById("app").innerHTML = `

        <div class="card">

            <button class="btn-grey btn-small back"
                    onclick="showPlayerManagement('${ageGroup}')">
                ← Back
            </button>

            <h2>Add Player - ${ageGroup}</h2>

            <div class="form-group">

                <label>
                    Player Name
                </label>

                <input
                    id="seniorNewPlayerName"
                    type="text"
                    maxlength="100"
                    autocomplete="off"
                >

            </div>

            <div class="form-group">

                <label>
                    GMS Status
                </label>

                <label class="toggle not-confirmed"
                       id="newPlayerGMSToggle">

                    <input
                        id="newPlayerGMS"
                        type="checkbox"
                        onchange="updateNewPlayerGMSToggle()"
                    >

                    <span class="toggle-track"></span>
                    <span class="toggle-knob"></span>

                    <span class="toggle-label">
                        NOT CONF.
                    </span>

                </label>

            </div>

            <button class="btn-green"
                    onclick="seniorAddPlayer('${ageGroup}')">
                Add Player
            </button>

        </div>

    `;

    document.getElementById("seniorNewPlayerName").focus();

}

function updateNewPlayerGMSToggle() {

    const input =
        document.getElementById("newPlayerGMS");

    const toggle =
        document.getElementById("newPlayerGMSToggle");

    if (input.checked) {

        toggle.classList.remove("not-confirmed");
        toggle.classList.add("confirmed");

        toggle.querySelector(".toggle-label")
            .textContent = "CONFIRMED";

    } else {

        toggle.classList.remove("confirmed");
        toggle.classList.add("not-confirmed");

        toggle.querySelector(".toggle-label")
            .textContent = "NOT CONF.";

    }

}

function seniorAddPlayer(ageGroup) {

    const name =
        document.getElementById("seniorNewPlayerName")
        .value
        .trim();

    const gms =
        document.getElementById("newPlayerGMS")
        .checked;

    if (!name) {

        alert("Please enter a player name.");

        return;
    }

    const id =
        Date.now()
        + Math.floor(Math.random() * 1000);

    players[ageGroup].push({

        id: id,
        name: name,
        ageGroup: ageGroup,
        gms: gms,
        active: true

    });

    alert(
        name
        + " has been added to "
        + ageGroup
        + "."
    );

    showPlayerManagement(ageGroup);

}

/* =========================================================
   NEW SEASON
   ========================================================= */

function showNewSeason() {

    const nextSeason =
        calculateNextSeason(currentSeason);

    const counts = {};

    ageGroups.forEach(age => {

        counts[age] =
            getActivePlayers(age).length;

    });

    document.getElementById("app").innerHTML = `

        <div class="card">

            <button class="btn-grey btn-small back"
                    onclick="showSeniorDashboard()">
                ← Back
            </button>

            <h2>Start New Season</h2>

            <div class="warning-box">

                <strong>This will move active players up one age group.</strong>

                <br><br>

                The change should only be made once at the start
                of the new season.

            </div>

            <p>
                Current season:
                <strong>${currentSeason}</strong>
            </p>

            <p>
                New season:
                <strong>${nextSeason}</strong>
            </p>

            <h3>Promotion Preview</h3>

            ${
                ageGroups.slice(0, -1).map(age => {

                    const next =
                        getNextAgeGroup(age);

                    return `

                        <div class="promotion-row">

                            <span>
                                ${age}
                                →
                                ${next}
                            </span>

                            <strong>
                                ${counts[age]}
                            </strong>

                        </div>

                    `;

                }).join("")
            }

            <div class="promotion-row">

                <span>
                    U18 → Leaving Active Register
                </span>

                <strong>
                    ${counts.U18}
                </strong>

            </div>

            <br>

            <div class="danger-box">

                <strong>
                    This action cannot be undone by the button.
                </strong>

                <br><br>

                Check the numbers above before continuing.

            </div>

            <button
                class="btn-blue"
                onclick="confirmNewSeason()">
                Confirm New Season
            </button>

        </div>

    `;

}

function calculateNextSeason(season) {

    const parts =
        season.split("/");

    const start =
        parseInt(parts[0], 10);

    const end =
        parseInt(parts[1], 10);

    return (
        start + 1
    ) + "/" + (
        String(end + 1).slice(-2)
    );

}

function confirmNewSeason() {

    const nextSeason =
        calculateNextSeason(currentSeason);

    const confirmed =
        confirm(
            "Start season "
            + nextSeason
            + "?\n\n"
            + "All active players will move up one age group."
            + "\n\n"
            + "U18 players will leave the active register."
        );

    if (!confirmed) {
        return;
    }

    performNewSeason(nextSeason);

}

function performNewSeason(nextSeason) {

    const newPlayers = {

        U7: [],
        U8: [],
        U9: [],
        U10: [],
        U11: [],
        U12: [],
        U13: [],
        U14: [],
        U15: [],
        U16: [],
        U17: [],
        U18: []

    };

    ageGroups.forEach(age => {

        const active =
            players[age]
                .filter(p => p.active);

        const inactive =
            players[age]
                .filter(p => !p.active);

        /*
            Keep inactive players in their existing age group
            so historical records aren't lost.
        */

        inactive.forEach(player => {

            newPlayers[age].push(player);

        });

        /*
            Move active players forward.
        */

        active.forEach(player => {

            const next =
                getNextAgeGroup(age);

            if (next) {

                player.ageGroup = next;

                newPlayers[next].push(player);

            } else {

                /*
                    U18 becomes inactive/graduated.
                */

                player.active = false;

                newPlayers[age].push(player);

            }

        });

    });

    players = newPlayers;

    currentSeason = nextSeason;

    todayAttendance = {};

    alert(
        "New season "
        + currentSeason
        + " has started."
    );

    showSeniorDashboard();

}

function showChangeSeniorPIN() {

    document.getElementById("app").innerHTML = `

                    onclick="showSeniorDashboard()">

            </button>

                    New PIN
                </label>

                <input
                    id="newSeniorPIN"
                    class="pin-input"
                    type="password"
                    inputmode="numeric"
                    maxlength="8"
                >

            </div>

            <div class="form-group">

                <label>
                    Confirm New PIN
                </label>

                <input
                    id="confirmSeniorPIN"
                    class="pin-input"
                    type="password"
                    inputmode="numeric"
                    maxlength="8"
                >

            </div>

            <div id="pinChangeError"
                 class="error">
            </div>

            <button class="btn-green"
                    onclick="changeSeniorPIN()">
                Change PIN
            </button>

        </div>

    `;

}

function changeSeniorPIN() {

    const newPIN =
        document.getElementById("newSeniorPIN")
        .value;

    const confirmPIN =
        document.getElementById("confirmSeniorPIN")
        .value;

    const error =
        document.getElementById("pinChangeError");

    error.textContent = "";

    if (!newPIN || !confirmPIN) {

        error.textContent =
            "Please enter and confirm the new PIN.";

        return;
    }

    if (newPIN !== confirmPIN) {

        error.textContent =
            "The PINs do not match.";

        return;
    }

    if (!/^\d+$/.test(newPIN)) {

        error.textContent =
            "PIN must contain numbers only.";

        return;
    }

    if (newPIN.length < 4) {

        error.textContent =
            "PIN must be at least 4 digits.";

        return;
    }

    seniorPIN = newPIN;

    alert("Senior PIN changed.");

    showSeniorDashboard();

}

/* =========================================================
   HTML SAFETY
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
